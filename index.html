body{background:#0b0712;background-size:cover;background-attachment:fixed;font-family:Cinzel,Georgia,serif}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 20% 30%,#7b4bd433,transparent 40%),radial-gradient(circle at 80% 70%,#d4892a26,transparent 40%),radial-gradient(circle at 50% 100%,#1e6a8a26,transparent 45%);animation:mist 18s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(1px 1px at 20% 30%,#fffc,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#ffe9a8,transparent),radial-gradient(1px 1px at 40% 80%,#fffc,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#bfe0ff,transparent),radial-gradient(1px 1px at 10% 70%,#fffc,transparent),radial-gradient(1px 1px at 55% 45%,#fff9,transparent);animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:.9}}@keyframes mist{to{transform:scale(1.25) translateX(3%);opacity:.6}}
.overlay{background:rgba(6,4,10,.42);height:100vh;height:100dvh}
.title{font-family:'Cinzel Decorative',Cinzel,serif;background:linear-gradient(#fff3b8,#e0a93a 55%,#8a5a14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #c9892f);letter-spacing:.25em}
.panel{background:linear-gradient(#1d1530f2,#0d0916f2);border:2px solid #7a5f2a;border-radius:14px;padding:.4rem;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 0 1px #2a1d08}
.panel.active{border-color:#f0c75a;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 18px #f0c75a88}
.panel.pc.active{border-color:#e0584a;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 18px #e0584a88}
.panel:not(.active){filter:saturate(.6) brightness(.8)}
.mat{position:relative;border:2px solid #7a5f2a;border-radius:16px;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 3.2rem,#e8c76614 3.2rem calc(3.2rem + 1px)),radial-gradient(ellipse at center,#2a2347 0%,#15102a 60%,#090618 100%);box-shadow:inset 0 0 50px #000,0 0 22px #6a3fd144}
.gold{background:linear-gradient(#f6dc8a,#c9962f 60%,#a8771c);border:1px solid #6b5426;color:#2a1a05;box-shadow:0 0 10px #c9962f55,inset 0 1px 0 #fff8}.gold:disabled{filter:grayscale(.7);opacity:.5}
.pname{font-weight:900;font-size:1rem;letter-spacing:.2em;opacity:.45}.pname.on{opacity:1;font-size:1.35rem;color:#ffe08a;text-shadow:0 0 12px #f0c75a}.pc .pname.on{color:#ff9d8f;text-shadow:0 0 12px #e0584a}
.turnbadge{background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;font-weight:900;font-size:.7rem;padding:.2rem .7rem;border-radius:999px;letter-spacing:.08em;animation:pulse 1.4s ease-in-out infinite}.pc .turnbadge{background:linear-gradient(#f0907f,#a8352a);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 14px #f0c75a;transform:scale(1.07)}}
.sideon{background:radial-gradient(ellipse at center,#f0c75a24,transparent 70%);border-radius:12px}
#field0:empty::after,#field1:empty::after{content:'· · ·';opacity:.2;letter-spacing:.5em}
/* ---- carte ---- */
.mcard{container-type:inline-size;position:relative;width:4.2rem;height:5.8rem;border-radius:9px;padding:3px;display:flex;flex-direction:column;border:2px solid #0a0a0a;box-shadow:0 0 0 1px #b8923f,0 4px 10px #000c;flex-shrink:0;transition:.15s;overflow:hidden;color:#1a1208}
.mcard::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff44 48%,transparent 60%);transform:translateX(-120%);transition:.7s}.mcard:hover::after{transform:translateX(120%)}
.l-R{background:linear-gradient(160deg,#e8704a,#6a1a0f)}.l-B{background:linear-gradient(160deg,#8c7a99,#1d1226)}.l-G{background:linear-gradient(160deg,#6fbf6a,#14411c)}.l-U{background:linear-gradient(160deg,#6ab4ee,#0f3a78)}.l-W{background:linear-gradient(160deg,#fff6d6,#cdb87a)}
.ct,.cty,.cx{background:linear-gradient(#f4ecd3,#d9ca9d);border:1px solid #0007;border-radius:3px;text-align:center;overflow:hidden;color:#1a1208}
.ct{font-weight:900;font-size:12cqw;white-space:nowrap;padding:1px 2px}.cty{font-size:8cqw;font-weight:700;white-space:nowrap;margin-top:2px}.cx{font-size:10cqw;line-height:1.1;padding:1px 2px;margin-top:2px;max-height:2.7em;overflow-wrap:anywhere}
.art{position:relative;flex:1;min-height:0;margin:2px 0;border:1px solid #000;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 8px #000a}
.art::before{content:'';position:absolute;left:0;right:0;bottom:0;height:52%}
.l-R .art{background:linear-gradient(#ffb36b,#c4361e 60%,#4a0f08)}.l-R .art::before{background:#2a0a06;clip-path:polygon(0 100%,0 60%,18% 25%,32% 62%,52% 8%,70% 58%,85% 30%,100% 62%,100% 100%)}
.l-B .art{background:linear-gradient(#6f5a82,#2a1b3a 60%,#0d0714)}.l-B .art::before{background:#08040c;clip-path:polygon(0 100%,0 70%,12% 40%,16% 70%,30% 55%,42% 20%,48% 70%,66% 50%,80% 25%,86% 68%,100% 55%,100% 100%)}
.l-G .art{background:linear-gradient(#bfe89a,#3d9a45 60%,#123d1a)}.l-G .art::before{background:#082310;clip-path:polygon(0 100%,0 55%,10% 20%,20% 55%,28% 55%,40% 10%,52% 55%,60% 55%,75% 22%,88% 58%,100% 45%,100% 100%)}
.l-U .art{background:linear-gradient(#bfe4ff,#3f8fe0 55%,#0b2f66)}.l-U .art::before{background:#07204a;clip-path:polygon(0 100%,0 55%,12% 40%,25% 55%,38% 40%,50% 55%,62% 40%,75% 55%,88% 40%,100% 55%,100% 100%)}
.l-W .art{background:linear-gradient(#fffbe6,#f3d98a 60%,#bf9c4a)}.l-W .art::before{background:#8a6a24;clip-path:polygon(0 100%,0 60%,25% 35%,55% 55%,80% 30%,100% 50%,100% 100%)}
.mana{position:relative;z-index:1;width:66cqw;aspect-ratio:1;background-size:contain;background-position:center;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px #000b)}

.mcard.sm{width:4.2rem;height:5.8rem}.mcard.xs{width:2.7rem;height:3.8rem}.mcard.xxs{width:2.1rem;height:3rem}.mcard.lg{width:min(62vw,13rem);height:calc(min(62vw,13rem)*1.4)}
.mcard.xs .ct,.mcard.xs .cty,.mcard.xs .cx,.mcard.xxs .ct,.mcard.xxs .cty,.mcard.xxs .cx{display:none}.mcard.xs .mana,.mcard.xxs .mana{width:75cqw;font-size:42cqw}
@media(min-width:640px){.mcard{width:6.6rem;height:9.2rem}.mcard.sm{width:5.4rem;height:7.6rem}.mcard.xs{width:3.8rem;height:5.3rem}.mcard.xxs{width:3rem;height:4.2rem}.mcard.lg{width:13rem;height:18.2rem}}
.mcard[onclick]{cursor:pointer}.mcard[onclick]:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 0 0 1px #f0c75a,0 8px 16px #000c,0 0 14px #f0c75a;z-index:3}
.hand{gap:0!important}.hand .mcard+.mcard{margin-left:-.35rem}@media(min-width:640px){.hand{gap:.5rem!important}.hand .mcard+.mcard{margin-left:0}}
.cback{width:2.2rem;height:3.1rem;border:2px solid #b8923f;border-radius:6px;flex-shrink:0;background:radial-gradient(circle,#e8c76666 0 16%,transparent 18%),repeating-linear-gradient(45deg,#2b1a3f,#2b1a3f 4px,#43295f 4px,#43295f 8px)}
.cback.opp{width:1.5rem;height:2.1rem;margin-left:-.5rem;border-radius:4px}.cback.opp:first-child{margin-left:0}
@media(min-width:640px){.cback.opp{width:2.2rem;height:3.1rem}}
/* ---- animazioni ---- */
@keyframes enter{0%{transform:translateY(130px) scale(1.8) rotate(-8deg);opacity:0;filter:brightness(2.2)}55%{opacity:1}100%{transform:none;filter:none}}
@keyframes enter2{0%{transform:translateY(-130px) scale(1.8) rotate(8deg);opacity:0;filter:brightness(2.2)}55%{opacity:1}100%{transform:none;filter:none}}
@keyframes die{0%{filter:brightness(3) saturate(2);transform:scale(1.1)}30%{transform:scale(1.18) rotate(4deg);filter:brightness(1.6) sepia(1) hue-rotate(-30deg)}100%{transform:scale(.35) rotate(20deg) translateY(30px);opacity:0;filter:blur(3px) grayscale(1)}}
.enter{animation:enter .55s cubic-bezier(.2,1.3,.4,1)}.enter2{animation:enter2 .55s cubic-bezier(.2,1.3,.4,1)}.dying{animation:die .65s ease-in forwards;pointer-events:none}
@keyframes drawn{0%{transform:translateY(-260px) scale(.4) rotate(-14deg);opacity:0}25%{opacity:1}100%{transform:none}}@keyframes drawn2{0%{transform:translateY(260px) scale(.6) rotate(10deg);opacity:0}25%{opacity:1}100%{transform:none}}
.drawn{animation:drawn .6s cubic-bezier(.2,1,.4,1)}.drawn2{animation:drawn2 .6s cubic-bezier(.2,1,.4,1)}
@keyframes deckpulse{0%{transform:scale(1)}35%{transform:scale(1.25);filter:drop-shadow(0 0 12px #8fd0ff)}100%{transform:scale(1)}}.deckpulse{animation:deckpulse .6s ease-out}
@keyframes pk{50%{transform:scale(1.08)}}.pickable{cursor:pointer;animation:pk 1s ease-in-out infinite;box-shadow:0 0 14px 3px #ffd54a!important;border-color:#ffe08a!important}.dim{opacity:.35;filter:grayscale(.7)}
/* ---- mazzo, cimiteri, avvisi ---- */
.pilepos{position:absolute;top:50%;transform:translateY(-50%);z-index:5}.pr{right:.15rem}.pl{left:.15rem}.fld{padding:0 3rem}
.pile,.dpile{position:relative;width:2.6rem;height:3.6rem;border-radius:6px}.pile{cursor:pointer;border:1.5px dashed #b8923f;display:flex;align-items:center;justify-content:center;background:#0006}
.pile .mcard{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-5deg)}.pempty{opacity:.3;font-size:1.2rem}
.dback{width:100%;height:100%;border:2px solid #b8923f;border-radius:6px;background:radial-gradient(circle,#e8c76677 0 16%,transparent 18%),repeating-linear-gradient(45deg,#2b1a3f,#2b1a3f 4px,#43295f 4px,#43295f 8px);box-shadow:2px 2px 0 #2b1a3f,4px 4px 0 #1a0f28,5px 5px 8px #000a}
.pcount{position:absolute;right:-.1rem;bottom:-.3rem;background:#0b0712;border:1px solid #b8923f;color:#ffe08a;font-size:.65rem;font-weight:900;border-radius:999px;min-width:1.2rem;height:1.2rem;display:flex;align-items:center;justify-content:center}
@media(min-width:640px){.pile,.dpile{width:3.6rem;height:5rem}.pcount{font-size:.75rem}.fld{padding:0 4.4rem}}
#pickBar{position:fixed;top:.5rem;left:50%;transform:translateX(-50%);z-index:30;background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;font-weight:900;padding:.4rem 1rem;border-radius:999px;box-shadow:0 0 18px #f0c75a;font-size:.8rem;max-width:90vw;text-align:center;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
.ldlogo{height:.8rem;width:auto;mix-blend-mode:screen}
.casting{opacity:.85;animation:castp 1s ease-in-out infinite;box-shadow:0 0 18px 4px #8fd0ff!important}@keyframes castp{50%{transform:scale(1.07);filter:brightness(1.4)}}
#toast{white-space:pre-line;position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:35;pointer-events:none;font-weight:900;font-size:1.2rem;color:#fff;text-shadow:0 0 14px #8f6bff,0 0 3px #000;padding:.5rem 1.2rem;border-radius:14px;background:#140a2ae6;border:2px solid #b8923f;text-align:center;max-width:90vw;animation:toast 1.7s ease-out forwards}
.blglogo{height:3.2rem;width:auto;-webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);filter:drop-shadow(0 0 10px #6a3fd1aa)}
@media(min-width:640px){.blglogo{height:4.2rem}}
.mat.turn0{border-color:#f0c75a;box-shadow:inset 0 0 50px #000,0 0 26px #f0c75a77}.mat.turn1{border-color:#e0584a;box-shadow:inset 0 0 50px #000,0 0 26px #e0584a77}
.turnline{display:flex;align-items:center;gap:.5rem}.tl-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.7}
.tl-pill{font-weight:900;letter-spacing:.15em;font-size:.85rem;padding:.25rem 1.1rem;border-radius:999px;border:2px solid;animation:pulse 1.4s ease-in-out infinite;white-space:nowrap}
.turnline.t0{color:#f0c75a}.t0 .tl-pill{background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;border-color:#fff3b8;box-shadow:0 0 16px #f0c75a}
.turnline.t1{color:#e0584a}.t1 .tl-pill{background:linear-gradient(#f0907f,#a8352a);color:#fff;border-color:#ffb3a6;box-shadow:0 0 16px #e0584a}
@media(min-width:640px){.tl-pill{font-size:1.05rem}}
.askbar{margin-top:.3rem;padding:.35rem .5rem;border:2px solid #ffd54a;border-radius:10px;background:#2a1d08;box-shadow:0 0 14px #ffd54a88;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35rem .8rem}
.asktxt{font-size:.72rem;font-weight:700;color:#ffe9a8;line-height:1.2}.askbtns{display:flex;gap:.5rem}.askno{background:#3a1d1d;border:1px solid #a8352a;color:#ffb3a6}

.mi{display:inline-block;width:1.25em;height:1.25em;background-size:contain;background-repeat:no-repeat;background-position:center;vertical-align:-.25em}
.rvflip{animation:rvflip .6s ease-out;box-shadow:0 0 14px 3px #ffe08a!important;margin:0 .1rem}
@keyframes rvflip{0%{transform:rotateY(90deg) scale(.7)}100%{transform:none}}
.pname{text-transform:uppercase;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .cx{display:flex!important;flex-direction:column;align-items:center;justify-content:center;font-size:11cqw!important;max-height:none!important;min-height:30%;padding:2px 3px;line-height:1.08;font-weight:800}
.ci{font-size:24cqw;line-height:1;filter:drop-shadow(0 1px 1px #0006)}.cw{display:block}
.mcard.lg .ci{font-size:16cqw}.mcard.lg .cw{font-size:8.5cqw;font-weight:700}
.mcard.xs .cx{min-height:0;padding:0;background:none;border:none}.mcard.xs .cw{display:none}.mcard.xs .ci{font-size:34cqw}.mcard.xxs .cx{display:none!important}
@media(max-width:639px){.mcard:not(.sm):not(.xs):not(.xxs):not(.lg){width:4.5rem;height:6.2rem}.hand .mcard+.mcard{margin-left:-.5rem}}
.playable{box-shadow:0 0 0 1px #f0c75a,0 0 10px #f0c75a99,0 4px 10px #000c}
.winner{animation:winglow 1s ease-in-out infinite alternate;box-shadow:0 0 0 2px #fff3b8,0 0 22px 6px #ffd54a!important;z-index:2}@keyframes winglow{to{transform:translateY(-8px) scale(1.12);filter:brightness(1.25)}}
.turnhint{text-align:center;font-size:.68rem;color:#ffe9a8;opacity:.9;margin-top:.15rem}@media(max-height:680px){.turnhint{display:none}}
.doms{display:inline-flex;gap:.45rem;align-items:center}.dm{position:relative;opacity:.28;filter:grayscale(1);transition:.3s}.dm.on{opacity:1;filter:drop-shadow(0 0 4px #ffe08a)}.dm .mi{width:1.45rem;height:1.45rem}
.dm b{position:absolute;right:-.3rem;bottom:-.3rem;font-size:.6rem;background:#0b0712;border:1px solid #b8923f;color:#ffe08a;border-radius:999px;min-width:.95rem;text-align:center;line-height:.95rem}
.rrow{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:.25rem 0;font-size:.78rem;text-align:left}.rrow .mi{width:1.6rem;height:1.6rem;flex-shrink:0}
#winFx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:cfall linear forwards}@keyframes cfall{to{transform:translateY(105vh) rotate(720deg)}}
.winban{position:absolute;top:50%;left:50%;text-align:center;background:#140a2aee;border:3px solid #ffd54a;border-radius:18px;padding:.8rem 1.6rem;box-shadow:0 0 40px #ffd54a99;max-width:90vw;animation:winpop .9s cubic-bezier(.2,1.5,.4,1) both,winout .6s 2.5s forwards}
.winban.l{border-color:#e0584a;box-shadow:0 0 40px #e0584a99}.wt{font-family:'Cinzel Decorative',Cinzel,serif;font-weight:900;font-size:2rem;color:#ffe08a;text-shadow:0 0 16px #ffd54a}.winban.l .wt{color:#ff9d8f;text-shadow:0 0 16px #e0584a}.wm{font-size:.8rem;margin-top:.3rem}
@keyframes winpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes winout{to{opacity:0}}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}input{-webkit-user-select:text;user-select:text}
#cursorFx{position:fixed;left:0;top:0;pointer-events:none;z-index:60}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo-t{font-family:'Cinzel Decorative',Cinzel,serif;font-weight:900;font-size:2.1rem;letter-spacing:.28em;padding-left:.28em;background:linear-gradient(#fff6c8 0%,#f0c75a 45%,#a8771c 55%,#f6dc8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2208) drop-shadow(0 0 12px #c9892f)}
.logo-m{display:flex;gap:.4rem;margin-top:.2rem}.logo-m .mi{width:1rem;height:1rem;animation:lfloat 3s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
@keyframes lfloat{50%{transform:translateY(-2px);filter:drop-shadow(0 0 5px #ffe08a)}}
@media(min-width:640px){.logo-t{font-size:2.8rem}.logo-m .mi{width:1.25rem;height:1.25rem}}
.endbox{position:relative;text-align:center;max-width:24rem;width:100%;padding:1.6rem 1.2rem 1.4rem;border-radius:22px;border:3px solid #ffd54a;background:radial-gradient(ellipse at 50% 0%,#4a2f78 0%,#1a1034 55%,#0b0614 100%);box-shadow:0 0 60px #ffd54a88,inset 0 0 40px #000;animation:endin .6s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
.endbox.lose{border-color:#e0584a;box-shadow:0 0 60px #e0584a88,inset 0 0 40px #000;background:radial-gradient(ellipse at 50% 0%,#5a1f2a 0%,#1a0a14 60%,#0b0614 100%)}
.endbox.tie{border-color:#9bb0d6;box-shadow:0 0 50px #9bb0d688,inset 0 0 40px #000}
.endicon{font-size:3.4rem;line-height:1;animation:efloat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 16px #ffd54a)}
.endtitle{font-family:'Cinzel Decorative',Cinzel,serif;font-weight:900;font-size:2rem;margin-top:.4rem;background:linear-gradient(#fff6c8,#f0c75a 50%,#a8771c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #c9892f)}
.endbox.lose .endtitle{background:linear-gradient(#ffd0c8,#e0584a 55%,#7a1d12);-webkit-background-clip:text;background-clip:text}
.endmsg{margin:.5rem 0 1.1rem;font-size:.85rem;opacity:.9}.endbtn{font-weight:900;letter-spacing:.12em;font-size:1.05rem;padding:.7rem 1.6rem;border-radius:14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes endin{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:none;opacity:1}}@keyframes efloat{50%{transform:translateY(-6px)}}

.coach{background:linear-gradient(#241a3d,#120b22);border:2px solid #f0c75a;border-radius:14px;padding:.35rem .6rem;box-shadow:0 0 16px #f0c75a66;text-align:center}
.coachhd{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;letter-spacing:.1em;color:#ffe08a}
.coachx{font-size:.62rem;opacity:.75;border:1px solid #6b5426;border-radius:8px;padding:0 .4rem}
.coachtx{font-size:.78rem;line-height:1.25;margin:.2rem 0;color:#fff}.coachbt{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}.coachbt:empty{display:none}

.passbox{text-align:center}.passname{font-family:'Cinzel Decorative',Cinzel,serif;font-weight:900;font-size:2rem;color:#ffe08a;text-shadow:0 0 16px #c9892f;margin-top:.3rem;word-break:break-word}

.skin-alpha .mcard{background:var(--al) center/100% 100% no-repeat!important;border:none!important;padding:0!important;border-radius:6px}
.skin-alpha .mcard.l-R{--al:var(--alR)}.skin-alpha .mcard.l-B{--al:var(--alB)}.skin-alpha .mcard.l-G{--al:var(--alG)}.skin-alpha .mcard.l-U{--al:var(--alU)}.skin-alpha .mcard.l-W{--al:var(--alW)}
.skin-alpha .mcard .ct,.skin-alpha .mcard .art,.skin-alpha .mcard .cty{display:none!important}
.skin-alpha .mcard .cx{position:absolute!important;left:12.6%;right:12.4%;top:60.5%;bottom:11.5%;min-height:0!important;padding:1px 2px!important;margin:0!important;background:rgba(246,238,212,.93)!important;border:1px solid #0007!important;border-radius:3px}
.skin-alpha .mcard.xs .cx{left:10%;right:10%}.skin-alpha .mcard.xxs .cx{display:none!important}
.skin-alpha .cback,.skin-alpha .dback{background:var(--alBack) center/100% 100% no-repeat!important;border:none!important;border-radius:5px}
.logo{position:relative}.logo-t{position:relative;z-index:1}
.orbit{position:absolute;left:50%;top:1.05rem;width:0;height:0;z-index:0;--rx:3.9rem;--ry:.95rem}
.orb{position:absolute!important;left:-.55rem;top:-.55rem;width:1.1rem!important;height:1.1rem!important;animation:ox 3.2s ease-in-out infinite alternate,oy 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-1.28s),calc(var(--k)*-1.28s - 1.6s)}
@keyframes ox{from{translate:calc(var(--rx)*-1) 0}to{translate:var(--rx) 0}}
@keyframes oy{from{transform:translateY(calc(var(--ry)*-1)) scale(.75);opacity:.55}to{transform:translateY(var(--ry)) scale(1.1);opacity:1}}
@media(min-width:640px){.orbit{top:1.4rem;--rx:5.2rem;--ry:1.15rem}.orb{width:1.35rem!important;height:1.35rem!important;left:-.675rem;top:-.675rem}}
.gpick{background:transparent!important;align-items:flex-start!important;pointer-events:none;padding-top:5rem!important}
.gpick>div{pointer-events:auto;max-height:36vh;border-color:#7fdc7a!important;box-shadow:0 0 30px #7fdc7acc,0 0 0 2px #0008}
.swpick{cursor:pointer;animation:swin .55s cubic-bezier(.2,1.4,.4,1) backwards,swbob 1.2s ease-in-out infinite;animation-delay:var(--d),calc(.6s + var(--d));box-shadow:0 0 0 2px #ffe08a,0 0 18px 5px #ffd54a!important}
@keyframes swin{0%{transform:rotateY(90deg) translateY(-20px) scale(.6);opacity:0}100%{transform:none;opacity:1}}@keyframes swbob{50%{transform:translateY(5px) scale(1.07)}}
.askbar.sw{background:#2a1d08}.panel.pickzone{border-color:#ffd54a!important;box-shadow:0 0 22px #ffd54acc!important;animation:pulse 1.4s ease-in-out infinite}
.tutbtn{display:block;margin:.9rem auto 0;border:2px solid #f0c75a;background:linear-gradient(#2a1f45,#171028);color:#ffe9a8;font-weight:800;padding:.45rem 1.4rem;border-radius:12px;font-size:.9rem;box-shadow:0 0 12px #f0c75a55;letter-spacing:.06em}
.rulesgo{display:block;margin:.6rem auto 0;font-size:1.3rem;padding:.75rem 3.2rem;border-radius:14px;letter-spacing:.15em}
.endscore{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.5rem;margin-top:.5rem;font-weight:800}.endscore:empty{display:none}

function winOf(f){const by={};f.forEach((c,i)=>{(by[c]=by[c]||[]).push(i);});const ks=Object.keys(by);
 if(ks.length>=5)return{k:'D',idxs:ks.slice(0,5).map(c=>by[c][0])};
 for(const c of ks)if(by[c].length>=5)return{k:'S',c,idxs:by[c].slice(0,5)};return null;}
function winFx(mine,txt){const e=$('winFx'),cols=mine?['#ffd54a','#ff7ab6','#6ad1ff','#8cff8a','#fff']:['#e0584a','#7a1d12','#555'];let c='';
 for(let i=0;i<36;i++)c+='<i class="cf" style="left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2.2+Math.random()*2.2)+'s;animation-delay:'+(Math.random()*.8)+'s"></i>';
 e.innerHTML=c+'<div class="winban '+(mine?'w':'l')+'"><div class="wt">'+(mine?'🏆 '+s('victory'):'💀 '+s('defeat'))+'</div><div class="wm">'+esc(txt)+'</div></div>';e.style.display='block';}
function showEnd(kind,msg,title,btn,cb,sc){ENDCB=cb||(()=>{gamesDone=0;score=[0,0];initDeck(0);});$('endBox').className='endbox '+kind;$('endIcon').textContent=kind==='win'?'🏆':kind==='lose'?'💀':'⚖️';
 $('endTitle').textContent=title||(kind==='win'?s('victory'):kind==='lose'?s('defeat'):s('tieT'));$('endScore').innerHTML=sc||'';$('endMsg').textContent=msg;$('endBtn').textContent=btn||s('again2');$('endModal').style.display='flex';}
function scoreHtml(){return '<div class="scl">'+t2('bo3')+'</div><span class="sn">'+esc(gn(0))+'</span><b>'+score[0]+'</b><i>–</i><b>'+score[1]+'</b><span class="sn">'+esc(gn(1))+'</span>';}
function checkWin(){const w=winOf(P[turn].field);if(!w)return;over=true;FX.win={pl:turn,idxs:w.idxs};
 const who=turn,two=!CPU(),mine=two||who===0,msg=gn(who)+' '+(w.k==='D'?s('winD'):s('winS')+' '+nm(w.c));
 sfx(mine?'win':'lose');winFx(mine,msg);render();
 let title=null,btn=null,cb=null,sc='';
 if(cfg.fmt==='bo3'&&!TUT){score[who]++;const dec=score[who]>=2;sc=scoreHtml();
  if(dec){title=two?gn(who)+' · '+t2('matchWin'):(who===0?t2('matchWon'):t2('matchLost'));btn=t2('newMatch');}
  else{title=two?t2('gameFor')+' '+gn(who):(who===0?t2('gameWon'):t2('gameLost'));btn=t2('nextGame');cb=()=>{gamesDone++;initDeck(gamesDone%2);};}}
 const k=mine?'win':'lose';aiLater(()=>showEnd(k,msg,title,btn,cb,sc),3300,true);}

function endTurn(fromAI){
 if(over||PICK||GPICK||PASSCB||$('choiceModal').style.display==='flex')return;
 if(fromAI!==true&&CPU()&&turn!==0)return;
 if(!deck.length&&!P[0].hand.length&&!P[1].hand.length){over=true;sfx('lose');showEnd('tie',s('tie'),null,cfg.fmt==='bo3'?t2('nextGame'):null,cfg.fmt==='bo3'?()=>{gamesDone++;initDeck(gamesDone%2);}:null,cfg.fmt==='bo3'?scoreHtml():'');return;}
 turn=1-turn;dropped=false;log('--- '+gn(turn)+' ---');sfx('pass');draw(turn);
 const go=()=>{render();if(TUT&&turn===0){TUT.step++;tutShow();}
  if(turn===1&&CPU())aiLater(aiTurn,900);
  else if(!P[turn].hand.length){log(s('noPlay'));toast(s('noPlay'));aiLater(()=>endTurn(true),1500);}};
 if(!CPU()&&VIEW!==turn&&P[turn].hand.length)handoff(turn,go);else{if(!CPU()&&P[turn].hand.length)VIEW=turn;go();}}
function handoff(p,cb){$('passT').textContent=t2('passPhone');$('passN').textContent=gn(p);$('passBtn').textContent=t2('ready');$('passModal').style.display='flex';PASSCB=()=>{$('passModal').style.display='none';VIEW=p;render();if(cb)cb();};}
const TMAP={0:'ti',1:'tu',2:'tu2',3:'tr',4:'tr2',5:'tg',6:'tg2',7:'tb',8:'tb2',9:'tw',10:'tw2',11:'tc',12:'tend'};
function tutShow(wait){const st=TUT.step,D=T2[lang];TUT.allow={1:'U',3:'R',5:'G',7:'B',9:'W'}[st]||null;let b='';
 if(!wait){if([0,2,4,6,8,10].includes(st))b='<button type="button" onclick="tutNext()" class="gold font-black px-5 py-1 rounded-lg">'+D.next+'</button>';
  if(st===12)b='<button type="button" onclick="tutExit()" class="gold font-black px-4 py-1 rounded-lg">'+D.playReal+'</button><button type="button" onclick="startTutorial()" class="coachbtn">'+D.replay+'</button>';}
 $('coach').innerHTML='<div class="coachhd"><span>🎓 '+D.tutT+' · '+Math.min(st+1,13)+'/13</span><button type="button" onclick="tutExit()" class="coachx">'+D.exit+' ✕</button></div><div class="coachtx">'+(wait?D.twait:D[TMAP[st]])+'</div><div class="coachbt">'+b+'</div>';render();}
function tutNext(){if(!TUT||PICK||GPICK||PASSCB)return;if(TUT.step===0){TUT.step=1;tutShow();return;}
 if([2,4,6,8,10].includes(TUT.step)){tutShow(true);endTurn(true);}}
function tutAfter(){if(turn===0){TUT.step++;tutShow();}else if(TUT.step===11){TUT.step=12;tutShow();}else aiLater(()=>endTurn(true),900);}
function tutExit(){gamesDone=0;score=[0,0];initDeck(0);}
function startTutorial(){['rulesModal','settingsModal','endModal','graveModal','zoomModal'].forEach(i=>{$(i).style.display='none';});initDeck(0,true);}
function aiTurn(){
 if(over||turn!==1)return;const h=P[1].hand,f=P[1].field;
 if(!h.length)return aiLater(()=>endTurn(true),700);
 if(TUT){const w=TUT.rp[TUT.ri++];let i=h.indexOf(w);if(i<0){h.push(w);i=h.length-1;}playCard(i,true);return;}
 const d=cfg.diff;if(d==='nabbo'){playCard(Math.floor(Math.random()*h.length),true);return;}
 let best=-1,bi=0;
 h.forEach((c,i)=>{let sc=(d==='pro'?Math.random()*.3:Math.random())+f.filter(x=>x===c).length*.8;if(!f.includes(c))sc+=2;if(c==='R'&&P[0].field.length)sc+=1;if(c==='B'&&P[0].hand.length)sc+=.5;if(d==='pro'&&c==='R'&&new Set(P[0].field).size>=3)sc+=3;if(winOf(f.concat(c)))sc+=100;if(c==='G'&&P[1].grave.length)sc+=.5;if(c==='W'&&f.some(x=>x!=='W'))sc+=.8;if(c==='U'&&deck.length)sc+=.3;if(sc>best){best=sc;bi=i;}});
 playCard(bi,true);}

function deckPile(){return '<div class="dpile'+(FX.drawn?' deckpulse':'')+'"><div class="dback"></div><span class="pcount">'+deck.length+'</span></div>';}
function fieldHtml(pi){const f=P[pi].field,g=FX.ghost&&FX.ghost[0]===pi,n=f.length+(g?1:0)+(FX.cast&&FX.cast[0]===pi?1:0),w=window.innerWidth>=640,z=n>(w?14:10)?'xxs':n>(w?8:3)?'xs':'sm';
 const pk=PICK&&PICK.zone==='field'&&PICK.pl===pi;
 const a=f.map((c,i)=>{const ok=pk&&PICK.idxs.includes(i);return card(c,z,ok?'onclick="pickDone(\'field\','+pi+','+i+')"':'onclick="zoom(\''+c+'\')"',(FX.add&&FX.add[0]===pi&&FX.add[1]===i?(pi===VIEW?'enter':'enter2'):'')+(ok?' pickable':'')+(FX.win&&FX.win.pl===pi?(FX.win.idxs.includes(i)?' winner':' dim'):''));});
 if(g)a.splice(FX.ghost[1],0,card(FX.ghost[2],z,'','dying'));if(FX.cast&&FX.cast[0]===pi)a.push(card(FX.cast[1],z,'','casting'));return a.join('');}
function dom(pi){const f=P[pi].field;return '<span class="doms">'+['W','U','B','R','G'].map(c=>{const n=f.filter(x=>x===c).length;return '<span class="dm'+(n?' on':'')+'"><i class="mi m-'+c+'"></i>'+(n>1?'<b>'+n+'</b>':'')+'</span>';}).join('')+'</span>';}
function zone(pi){const p=P[pi],me=pi===turn,mine=pi===VIEW;
 const hp=PICK&&PICK.zone==='hand'&&PICK.pl===pi;
 const ask=(mine&&PICK&&PICK.ask)?'<div class="askbar"><div class="asktxt">'+esc(PICK.title)+'</div><div class="askbtns"><button type="button" onclick="askYes()" class="gold font-black px-5 py-1 rounded-lg">'+s('yes').toUpperCase()+'</button><button type="button" onclick="askNo()" class="askno font-black px-5 py-1 rounded-lg">NO</button></div></div>':'';
 const sw=(!mine&&hp&&!PICK.ask)?'<div class="askbar sw"><div class="asktxt">👆 '+esc(PICK.title)+'</div></div>':'';
 let h='<div class="panel'+(me?' active':'')+(mine?'':' pc')+(sw?' pickzone':'')+'"><div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-1"><span class="pname'+(me?' on':'')+'">'+esc(gn(pi))+'</span>'+dom(pi)+'</div>'+ask+sw;
 h+='<div class="'+(mine?'hand ':'')+'flex flex-wrap justify-center gap-1.5 sm:gap-2 mt-1 '+(mine?'min-h-[5.8rem] sm:min-h-[9.5rem] ':'')+'items-end">';
 h+=mine?p.hand.map((c,i)=>{const ok=hp&&PICK.idxs.includes(i);return card(c,false,hp?(ok?'onclick="pickDone(\'hand\','+pi+','+i+')"':''):'onpointerdown="lpStart(\''+c+'\')" onpointerup="lpEnd()" onpointerleave="lpEnd()" oncontextmenu="return false" onclick="if(lpF){lpF=false;return}playCard('+i+')"',(FX.drawn&&FX.drawn[0]===pi&&FX.drawn[1]===i?'drawn ':'')+(ok?'pickable':hp?'dim':FX.hl&&FX.hl.pl===pi?(FX.hl.idxs.includes(i)?'pickable':'dim'):(TUT?(turn===0&&TUT.allow?(TUT.allow===c?'pickable':'dim'):''):(turn===pi&&!dropped&&!over?'playable':''))));}).join('')
  :p.hand.map((c,i)=>FX.reveal&&FX.reveal[0]===pi&&FX.reveal[1].includes(i)?(hp&&PICK.idxs.includes(i)?card(c,p.hand.length>4?'xs':'sm','onclick="pickDone(\'hand\','+pi+','+i+')" style="--d:'+(i*.07).toFixed(2)+'s"','swpick'):card(c,'xs','','rvflip')):'<div class="cback opp'+(FX.drawn&&FX.drawn[0]===pi&&FX.drawn[1]===i?' drawn2':'')+'"></div>').join('');
 return h+'</div></div>';}

 const top=1-VIEW;

 $('log').style.display=TUT?'none':'';$('coach').style.display=TUT?'block':'none';
 const pb=$('pickBar');pb.style.display=PICK&&!PICK.ask?'block':'none';if(PICK)pb.textContent=PICK.title;

// ---------- cursore: polvere magica dorata (solo mouse) ----------
(function(){if(!window.matchMedia||!window.matchMedia('(hover:hover) and (pointer:fine)').matches||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.id='cursorFx';document.body.appendChild(cv);const g=cv.getContext('2d');
 let W=0,H=0,px=-1,py=-1,run=false,ps=[];
 function sprite(star){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');
  if(!star){const gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,248,222,1)');gr.addColorStop(.25,'rgba(255,214,120,.75)');gr.addColorStop(1,'rgba(255,190,70,0)');x.fillStyle=gr;x.fillRect(0,0,32,32);}
  else{x.translate(16,16);x.fillStyle='rgba(255,240,190,.95)';x.beginPath();for(let i=0;i<8;i++){const r=i%2?2.4:15,a=i*Math.PI/4;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.closePath();x.fill();}
  return c;}
 const dot=sprite(false),star=sprite(true);
 function rs(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);}
 rs();addEventListener('resize',rs);
 function spawn(x,y,n,burst){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=burst?1+Math.random()*2.4:Math.random()*.45;
  ps.push({x:x+(Math.random()-.5)*6,y:y+(Math.random()-.5)*6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.1,l:1,d:burst?.022:.011+Math.random()*.012,s:burst?6+Math.random()*8:5+Math.random()*10,st:Math.random()<.22,ph:Math.random()*6.28});}
  if(ps.length>280)ps.splice(0,ps.length-280);}
 function go(){if(!run){run=true;requestAnimationFrame(loop);}}
 addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const x=e.clientX,y=e.clientY;
  if(px>=0){const dx=x-px,dy=y-py,n=Math.min(8,Math.ceil(Math.hypot(dx,dy)/7));for(let i=1;i<=n;i++)spawn(px+dx*i/n,py+dy*i/n,1,false);}else spawn(x,y,2,false);
  px=x;py=y;go();},{passive:true});
 document.addEventListener('mouseleave',()=>{px=-1;});
 addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){spawn(e.clientX,e.clientY,16,true);go();}});
 function loop(t){g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';ps=ps.filter(p=>p.l>0);
  for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.012;p.l-=p.d;const tw=.65+.35*Math.sin(t/90+p.ph);g.globalAlpha=Math.max(p.l,0)*tw*.9;const z=p.s*(.45+.55*p.l);g.drawImage(p.st?star:dot,p.x-z/2,p.y-z/2,z,z);}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(ps.length)requestAnimationFrame(loop);else{run=false;g.clearRect(0,0,W,H);}}
})();
