<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLG</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0f0f12;background-size:cover;background-attachment:fixed}.overlay{background:rgba(15,15,18,.82);min-height:100vh}</style></head>
<body id="body"><div class="overlay p-3 font-mono text-white"><div class="max-w-4xl mx-auto">
<div class="flex justify-between items-start mb-5"><div class="text-center flex-1"><h1 class="text-6xl font-black">BLG</h1><div class="text-indigo-300 font-bold tracking-widest mt-1">BASIC LAND GAME</div><div class="text-xs opacity-60 mt-1" id="sub"></div></div>
<button id="settingsBtn" type="button" class="bg-zinc-800 border border-white/20 px-4 py-2 rounded-xl text-sm">⚙️</button></div>
<div class="bg-zinc-900/90 border border-white/10 rounded-2xl p-4 flex justify-between items-center mb-3"><div><div class="text-xs opacity-60" id="lblTurn"></div><div id="turnLabel" class="text-4xl font-black text-yellow-300">G1</div></div><div class="text-xs text-center"><div id="dropLabel"></div><div class="opacity-60 mt-1"><span id="lblDeck"></span>: <span id="deckCount">0</span></div></div><button id="btnPass" type="button" class="bg-yellow-300 text-black font-bold px-6 py-2 rounded-xl"></button></div>
<div id="boards" class="grid md:grid-cols-2 gap-3"></div>
<div id="log" class="mt-4 bg-black/80 rounded-xl p-3 h-28 overflow-auto text-xs opacity-80"></div></div></div>

<div id="settingsModal" style="display:none" class="fixed inset-0 bg-black/80 items-center justify-center z-40 p-4"><div class="bg-zinc-900 border border-white/20 rounded-2xl max-w-md w-full p-6 font-mono text-white">
<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">SETTINGS</h2><button id="closeSettingsBtn" type="button" class="text-2xl opacity-60">✕</button></div>
<label class="text-xs opacity-60 uppercase">Language</label><select id="langSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="it">Italiano</option><option value="en">English</option></select>
<label class="text-xs opacity-60 uppercase" id="lblSize"></label><select id="sizeSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="25">25</option><option value="50">50</option></select>
<label class="text-xs opacity-60 uppercase" id="lblHand"></label><select id="handSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="3">3</option><option value="5">5</option></select>
<label class="text-xs opacity-60 uppercase">Background</label><div class="grid grid-cols-3 gap-2 mt-2" id="bgGrid"></div></div></div>

<div id="choiceModal" style="display:none" class="fixed inset-0 bg-black/85 items-center justify-center z-50 p-4"><div class="bg-zinc-900 border border-yellow-300/50 rounded-2xl max-w-md w-full p-6 font-mono text-white"><div id="choiceTitle" class="font-bold mb-4"></div><div id="choiceOpts"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const S={it:{sub:'5 diverse o 5 uguali per vincere',turn:'TURNO ATTUALE',pass:'PASSA',deck:'Mazzo',size:'Carte nel mazzo',hand:'Mano iniziale',dropN:'Terra giocata: NO',dropY:'Terra giocata: SÌ',field:'CAMPO',handL:'MANO',grave:'CIMITERO',player:'GIOCATORE',newgame:'Nuova partita',draws:'pesca',plays:'gioca',already:'Puoi giocare una sola terra per turno',counter:'vuoi contrastare con Isola? (scarti Isola + 1 carta)',yes:'Sì',no:'No',disc2:'Scegli la carta da scartare insieme all\'Isola',countered:'contrasta l\'effetto con Isola!',pickLand:'Scegli la terra avversaria da distruggere',noTarget:'nessun bersaglio',destroyed:'distrutta',swamp:'Palude: scegli quale carta fa scartare (mano avversaria)',discarded:'scarta',noCards:'nessuna carta',forest:'Foresta: scegli la terra da riprendere',back:'riprende',scry:'Scry 1 - carta in cima:',top:'Tieni in cima',bottom:'Metti in fondo',deckEmpty:'Mazzo finito',winD:'VINCE! 5 terre diverse (Domain)!',winS:'VINCE! 5 terre uguali:',again:'Nuova partita',hidden:'carte coperte',
n:{R:'MONTAGNA',B:'PALUDE',G:'FORESTA',U:'ISOLA',W:'PIANURA'},e:{R:'Distrugge una terra avversaria',B:'L\'avversario mostra 3 carte e ne scarta 1',G:'Riprendi una terra dal cimitero',U:'Scry 1 / Contrasta (scarta con 1 carta)',W:'Pesca una carta'}},
en:{sub:'5 different or 5 equal to win',turn:'CURRENT TURN',pass:'PASS',deck:'Deck',size:'Deck size',hand:'Starting hand',dropN:'Land played: NO',dropY:'Land played: YES',field:'FIELD',handL:'HAND',grave:'GRAVEYARD',player:'PLAYER',newgame:'New game',draws:'draws',plays:'plays',already:'Only one land per turn',counter:'counter with Island? (discard Island + 1 card)',yes:'Yes',no:'No',disc2:'Choose the card to discard with the Island',countered:'counters the effect with Island!',pickLand:'Choose the opponent land to destroy',noTarget:'no target',destroyed:'destroyed',swamp:'Swamp: choose which card to discard (opponent hand)',discarded:'discards',noCards:'no cards',forest:'Forest: choose a land to return',back:'returns',scry:'Scry 1 - top card:',top:'Keep on top',bottom:'Put on bottom',deckEmpty:'Deck empty',winD:'WINS! 5 different lands (Domain)!',winS:'WINS! 5 of a kind:',again:'New game',hidden:'hidden cards',
n:{R:'MOUNTAIN',B:'SWAMP',G:'FOREST',U:'ISLAND',W:'PLAINS'},e:{R:'Destroy an opponent land',B:'Opp. reveals 3 cards, discards 1',G:'Return a land from graveyard',U:'Scry 1 / Counter (discard with 1 card)',W:'Draw a card'}}};
const CLS={R:'bg-red-600',B:'bg-stone-700',G:'bg-green-700',U:'bg-blue-600',W:'bg-amber-100 text-black'};
const BG={default:'#0f0f12',plains:'linear-gradient(#f8f1d0,#c9b97a)',island:'linear-gradient(#1e5fa8,#0a2a52)',swamp:'linear-gradient(#3a2f3f,#0c0810)',mountain:'linear-gradient(#c0392b,#4a0f0a)',forest:'linear-gradient(#2e7d32,#0b2a10)'};
const store={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('blg_lang','it'),cfg={size:+store.get('blg_size',25),hand:+store.get('blg_hand',5)};
let deck=[],P=[],turn=0,dropped=false,over=false;
const s=k=>S[lang][k], nm=c=>S[lang].n[c];

function log(t){const el=$('log');el.innerHTML='> '+t+'<br>'+el.innerHTML;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function choose(title,opts,cb){const m=$('choiceModal');$('choiceTitle').textContent=title;const box=$('choiceOpts');box.innerHTML='';
 opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='w-full bg-zinc-800 border border-white/20 rounded-xl p-3 mb-2 text-left';b.textContent=o.label;b.onclick=()=>{m.style.display='none';cb(o.val);};box.appendChild(b);});m.style.display='flex';}

function initDeck(){
 const per=cfg.size/5;deck=[];['R','B','G','U','W'].forEach(c=>{for(let i=0;i<per;i++)deck.push(c);});shuffle(deck);
 P=[{hand:[],field:[],grave:[]},{hand:[],field:[],grave:[]}];
 for(let p=0;p<2;p++)for(let i=0;i<cfg.hand;i++)P[p].hand.push(deck.pop());
 turn=0;dropped=false;over=false;$('log').innerHTML='';log(s('newgame')+' ('+cfg.size+' / '+cfg.hand+')');render();}
function draw(p){if(!deck.length){log(s('deckEmpty'));return;}P[p].hand.push(deck.pop());}

function playCard(idx){
 if(over||$('choiceModal').style.display==='flex')return;
 if(dropped){log(s('already'));return;}
 const me=P[turn],oi=1-turn,opp=P[oi],card=me.hand.splice(idx,1)[0];
 me.field.push(card);dropped=true;log('G'+(turn+1)+' '+s('plays')+' '+nm(card));
 const done=()=>{checkWin();render();};
 // Isola dell'avversario: contrasta l'effetto (la terra resta in gioco)
 if(opp.hand.includes('U')&&opp.hand.length>=2){
  choose('G'+(oi+1)+': '+s('counter'),[{label:s('yes'),val:1},{label:s('no'),val:0}],v=>{
   if(!v)return etb(card,me,opp,done);
   opp.grave.push(opp.hand.splice(opp.hand.indexOf('U'),1)[0]);
   choose(s('disc2'),opp.hand.map((c,i)=>({label:nm(c),val:i})),i=>{opp.grave.push(opp.hand.splice(i,1)[0]);log('G'+(oi+1)+' '+s('countered'));done();});
  });
 }else etb(card,me,opp,done);
}

function etb(card,me,opp,done){
 if(card==='W'){draw(turn);log('G'+(turn+1)+' '+s('draws'));return done();}
 if(card==='U'){if(!deck.length)return done();const top=deck[deck.length-1];
  return choose(s('scry')+' '+nm(top),[{label:s('top'),val:0},{label:s('bottom'),val:1}],v=>{if(v)deck.unshift(deck.pop());done();});}
 if(card==='R'){if(!opp.field.length){log(s('noTarget'));return done();}
  return choose(s('pickLand'),opp.field.map((c,i)=>({label:nm(c),val:i})),i=>{const c=opp.field.splice(i,1)[0];opp.grave.push(c);log(nm(c)+' '+s('destroyed'));done();});}
 if(card==='B'){if(!opp.hand.length){log(s('noCards'));return done();}
  const idxs=shuffle(opp.hand.map((c,i)=>i)).slice(0,3);
  return choose(s('swamp'),idxs.map(i=>({label:nm(opp.hand[i]),val:i})),i=>{const c=opp.hand.splice(i,1)[0];opp.grave.push(c);log('G'+(P.indexOf(opp)+1)+' '+s('discarded')+' '+nm(c));done();});}
 if(card==='G'){const types=[...new Set(me.grave)];if(!types.length){log(s('noCards'));return done();}
  return choose(s('forest'),types.map(c=>({label:nm(c),val:c})),c=>{me.grave.splice(me.grave.lastIndexOf(c),1);me.hand.push(c);log('G'+(turn+1)+' '+s('back')+' '+nm(c));done();});}
 done();}

function checkWin(){
 const f=P[turn].field,cnt={};f.forEach(c=>cnt[c]=(cnt[c]||0)+1);
 let msg=null;
 if(Object.keys(cnt).length>=5)msg=s('winD');
 else for(const k in cnt)if(cnt[k]>=5)msg=s('winS')+' '+nm(k);
 if(msg){over=true;choose('G'+(turn+1)+' '+msg,[{label:s('again'),val:1}],initDeck);}}

function endTurn(){
 if(over||$('choiceModal').style.display==='flex')return;
 turn=1-turn;dropped=false;log('--- G'+(turn+1)+' ---');draw(turn);render();}

function render(){
 $('sub').textContent=s('sub');$('lblTurn').textContent=s('turn');$('btnPass').textContent=s('pass');$('lblDeck').textContent=s('deck');
 $('lblSize').textContent=s('size');$('lblHand').textContent=s('hand');
 $('deckCount').textContent=deck.length;$('turnLabel').textContent='G'+(turn+1);$('dropLabel').textContent=dropped?s('dropY'):s('dropN');
 let h='';
 P.forEach((p,pi)=>{const me=pi===turn;
  h+='<div class="bg-zinc-900/90 border '+(me?'border-yellow-300':'border-white/10')+' p-3 rounded-2xl"><div class="font-bold '+(me?'text-yellow-300':'opacity-60')+'">'+s('player')+' '+(pi+1)+(me?' ◀':'')+'</div>';
  h+='<div class="text-xs opacity-50 mt-3">'+s('field')+' ('+p.field.length+'):</div><div class="flex flex-wrap gap-1 mt-1">'+p.field.map(c=>'<div class="'+CLS[c]+' px-2 py-1 rounded text-xs font-bold">'+nm(c)+'</div>').join('')+'</div>';
  h+='<div class="text-xs opacity-50 mt-3">'+s('handL')+' ('+p.hand.length+'):</div><div class="flex flex-wrap gap-2 mt-1">';
  h+=me?p.hand.map((c,i)=>'<div onclick="playCard('+i+')" class="'+CLS[c]+' w-24 h-28 rounded-xl flex flex-col items-center justify-center p-1 cursor-pointer hover:scale-105 border border-white/10 text-center"><span class="font-black text-xs">'+nm(c)+'</span><span class="text-[10px] mt-1 opacity-80">'+S[lang].e[c]+'</span></div>').join('')
   :p.hand.map(()=>'<div class="w-10 h-14 rounded-lg bg-indigo-900 border border-white/20"></div>').join('');
  h+='</div><div class="text-xs opacity-50 mt-3">'+s('grave')+' ('+p.grave.length+'): <span class="opacity-80">'+p.grave.map(nm).join(', ')+'</span></div></div>';});
 $('boards').innerHTML=h;}

function setBg(n){$('body').style.background=BG[n]||BG.default;$('body').style.backgroundSize='cover';$('body').style.backgroundAttachment='fixed';store.set('blg_bg',n);}
$('bgGrid').innerHTML=Object.keys(BG).map(k=>'<button type="button" data-bg="'+k+'" class="bgBtn rounded-xl h-16 border-2 border-white/20 text-xs font-bold" style="background:'+BG[k]+';color:'+(k==='plains'?'#000':'#fff')+'">'+k.toUpperCase()+'</button>').join('');
document.querySelectorAll('.bgBtn').forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.bg)));
$('settingsBtn').addEventListener('click',()=>$('settingsModal').style.display='flex');
const closeS=()=>$('settingsModal').style.display='none';
$('closeSettingsBtn').addEventListener('click',closeS);
$('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeS();});
$('btnPass').addEventListener('click',endTurn);
$('langSelect').addEventListener('change',e=>{lang=e.target.value;store.set('blg_lang',lang);render();});
$('sizeSelect').addEventListener('change',e=>{cfg.size=+e.target.value;store.set('blg_size',cfg.size);initDeck();});
$('handSelect').addEventListener('change',e=>{cfg.hand=+e.target.value;store.set('blg_hand',cfg.hand);initDeck();});
$('langSelect').value=lang;$('sizeSelect').value=cfg.size;$('handSelect').value=cfg.hand;
setBg(store.get('blg_bg','default'));initDeck();
</script></body></html>
