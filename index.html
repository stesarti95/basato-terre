<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLG</title><script src="https://cdn.tailwindcss.com"></script><style>body{background-size:cover;background-position:center;background-attachment:fixed;background-color:#}.overlay{background:rgba(15,15,18,.88);min-height:100vh}</style></head><body id="body"><div class="overlay min-h-screen p-3 font-mono text-white"><div class="max-w-4xl mx-auto"><div class="flex justify-between items-start mb-5"><div class="text-center flex-1"><h1 class="text-6xl font-black">BLG</h1><div class="text-indigo-300 font-bold tracking-widest mt-1">BASIC LAND GAME</div><div class="text-xs opacity-60 mt-1">5 to win, different or equals</div></div><button id="settingsBtn" type="button" class="bg-zinc-800 border border-white/20 px-4 py-2 rounded-xl text-sm">⚙️ SETTINGS</button></div><div class="bg-zinc-900/90 border border-white/10 rounded-2xl p-4 flex justify-between items-center mb-3"><div class="text-xs opacity-60" id="lblTurn">TURNO ATTUALE</div><div id="turnLabel" class="text-4xl font-black text-yellow-300">G1</div><button id="btnPass" type="button" class="bg-yellow-300 text-black font-bold px-6 py-2 rounded-xl">PASSA</button></div><div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-zinc-900/90 border border-white/10 rounded-2xl p-4 text-center"><div class="text-xs opacity-60" id="lblDeck">MAZZO</div><div class="text-2xl font-bold mt-1"><span id="deckCount">0</span> carte</div><button id="btnDraw" type="button" class="mt-3 w-full bg-white text-black font-bold py-2 rounded-xl">PESCA</button></div><div class="bg-zinc-900/90 border border-white/10 rounded-2xl p-4 text-center"><div class="text-xs opacity-60">CIMITERO</div><div class="text-2xl font-bold mt-1"><span id="graveCount">0</span> carte</div><div id="lastGrave" class="text-xs opacity-40 mt-2 h-4"></div></div></div><div id="boards" class="grid md:grid-cols-2 gap-3"></div><div id="log" class="mt-4 bg-black/80 rounded-xl p-3 h-24 overflow-auto text-xs opacity-70"></div></div></div><div id="settingsModal" style="display:none" class="fixed inset-0 bg-black/80 backdrop-blur-sm items-center justify-center z- p-4"><div class="bg-zinc-900 border border-white/20 rounded-2xl max-w-md w-full p-6 font-mono text-white"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-black">SETTINGS</h2><button id="closeSettingsBtn" type="button" class="text-2xl opacity-60">✕</button></div><div class="mb-6"><label class="text-xs opacity-60 uppercase">Language</label><select id="langSelect" class="w-full mt-2 bg-black border border-white/20 rounded-xl p-3 text-white"><option value="it">Italiano</option><option value="en">English</option></select></div><div><label class="text-xs opacity-60 uppercase">Background</label><div class="grid grid-cols-3 gap-2 mt-3"><button type="button" data-bg="default" class="bgBtn bg-black border-2 border-white/20 rounded-xl h-20 flex items-center justify-center text-xs">DEFAULT<br>BLACK</button><button type="button" data-bg="plains" class="bgBtn rounded-xl h-20 bg-cover border-2 border-white/20 bg-zinc-700 flex items-end justify-center pb-1">Plains</button><button type="button" data-bg="island" class="bgBtn rounded-xl h-20 bg-cover border-2 border-white/20 bg-zinc-700 flex items-end justify-center pb-1">Island</button><button type="button" data-bg="swamp" class="bgBtn rounded-xl h-20 bg-cover border-2 border-white/20 bg-zinc-700 flex items-end justify-center pb-1">Swamp</button><button type="button" data-bg="mountain" class="bgBtn rounded-xl h-20 bg-cover border-2 border-white/20 bg-zinc-700 flex items-end justify-center pb-1">Mountain</button><button type="button" data-bg="forest" class="bgBtn rounded-xl h-20 bg-cover border-2 border-white/20 bg-zinc-700 flex items-end justify-center pb-1">Forest</button></div></div></div></div><script>const bgColors={plains:'#',island:'#',swamp:'#',mountain:'#',forest:'#',default:'#'};function setBg(name){let body=document.getElementById('body');localStorage.setItem('blg_bg',name);if(name==='default'){body.style.backgroundImage='';body.style.backgroundColor='#';return;}body.style.backgroundColor=bgColors||'#';body.style.backgroundImage="url('"+name+".jpg')";}function openSettings(){document.getElementById('settingsModal').style.display='flex';}function closeSettings(){document.getElementById('settingsModal').style.display='none';}function setLang(l){curLang=l;localStorage.setItem('blg_lang',l);applyLang();}function applyLang(){let t=i18n;document.getElementById('lblTurn').innerText=t.turn;document.getElementById('btnPass').innerText=t.pass;document.getElementById('lblDeck').innerText=t.deck;document.getElementById('btnDraw').innerText=t.draw;}const i18n={it:{turn:'TURNO ATTUALE',pass:'PASSA',deck:'MAZZO',draw:'PESCA',newgame:'Nuova partita BLG',deckempty:'Mazzo finito',draws:'pesca',plays:'gioca',counter:'vuoi fare COUNTER FOIL? Scarti Isola + 1 carta?',chooseland:'Scegli terra da spaccare',opphand:'Mano avversario',win5diff:'VINCE! 5 colori diversi!',win5same:'VINCE! 5x',turnLabel:'Turno'},en:{turn:'CURRENT TURN',pass:'PASS',deck:'DECK',draw:'DRAW',newgame:'New BLG game',deckempty:'Deck empty',draws:'draws',plays:'plays',counter:'do you want to COUNTER with FOIL? Discard Island + 1?',chooseland:'Choose land to destroy',opphand:'Opponent hand',win5diff:'WINS! 5 different colors!',win5same:'WINS! 5x',turnLabel:'Turn'}};let curLang=localStorage.getItem('blg_lang')||'it';const INFO={R:{n:'MONTAGNA',cls:'bg-red-600',eff:'ROSSO: spacca'},B:{n:'PALUDE',cls:'bg-stone-700',eff:'NERO: scarta'},G:{n:'FORESTA',cls:'bg-green-700',eff:'VERDE: recupera'},U:{n:'ISOLA',cls:'bg-blue-600',eff:'BLU: pesca/FOIL'},W:{n:'PIANURA',cls:'bg-amber-100 text-black',eff:'BIANCO: ricopia'},C:{n:'JOLLY',cls:'bg-zinc-600',eff:'JOLLY'}};let deck=[];let P=[{hand:[],field:[],grave:[]},{hand:[],field:[],grave:[]}];let turn=0;function t(k){return (i18n&&i18n)||k;}function initDeck(){deck=[];['R','B','G','U','W'].forEach(c=>{for(let i=0;i<7;i++) http://deck.push(c)});for(let i=0;i<5;i++) http://deck.push('C');deck.sort(()=>Math.random()-0.5);P=[{hand:[],field:[],grave:[]},{hand:[],field:[],grave:[]}];for(let p=0;p<2;p++) for(let i=0;i<3;i++) http://P.hand.push(deck.pop());turn=0;log(t('newgame'));render();}function drawCard(){if(deck.length===0){log(t('deckempty'));return;}P.hand.push(deck.pop());log('G'+(turn+1)+' '+t('draws'));render();}function playCard(pi,idx){if(pi!==turn) return;let card=P.hand;let opp=1-pi;if(P.hand.includes('U')&&P.hand.length>=2){if(confirm('G'+(opp+1)+' '+t('counter'))){let ui=P.hand.indexOf('U');P.grave.push(P.hand.splice(ui,1));P.grave.push(P.hand.splice(0,1));P.grave.push(P.hand.splice(idx,1));log('G'+(opp+1)+' COUNTERA FOIL!');render();return;}}P.hand.splice(idx,1);P.field.push(card);log('G'+(pi+1)+' '+t('plays')+' '+INFO.n);if(card==='R'&&P.field.length>0){let tt=prompt(t('chooseland')+' 0-'+(P.field.length-1));let ti=parseInt(tt);if(!isNaN(ti)&&P.field) http://P.grave.push(P.field.splice(ti,1));}if(card==='B'&&P.hand.length>0){alert(t('opphand')+': '+P.hand.map(c=>INFO.n).join(', '));P.grave.push(P.hand.splice(0,1));}if(card==='G'&&P.grave.length>0) http://P.hand.push(P.grave.pop());if(card==='U'&&deck.length>0) http://P.hand.push(deck.pop());if(card==='W'&&P.field.length>1){let prev=P.field[P.field.length-2];if(prev==='U'&&deck.length>0) http://P.hand.push(deck.pop());if(prev==='G'&&P.grave.length>0) http://P.hand.push(P.grave.pop());}checkWin();render();}function checkWin(){let f=P.field.filter(c=>c!=='C');let uniq=[...new Set(f)];if(uniq.length>=5){alert('G'+(turn+1)+' '+t('win5diff'));initDeck();return;}let cnt={};f.forEach(c=>{cnt=(cnt||0)+1});for(let k in cnt) if(cnt>=5){alert('G'+(turn+1)+' '+t('win5same')+' '+INFO.n);initDeck();return;}}function endTurn(){turn=1-turn;log('--- '+t('turnLabel')+' G'+(turn+1)+' ---');render();}function log(txt){let el=document.getElementById('log');el.innerHTML='> '+txt+'<br>'+el.innerHTML;}function render(){document.getElementById('deckCount').innerText=deck.length;document.getElementById('graveCount').innerText=P.grave.length+P.grave.length;document.getElementById('turnLabel').innerText='G'+(turn+1);let last=P.grave.concat(P.grave).slice(-1);document.getElementById('lastGrave').innerText=last?INFO.n:'';let html='';P.forEach((p,pi)=>{html+='<div class="bg-zinc-900/90 border '+(pi===turn?'border-yellow-300':'border-white/10')+' p-3 rounded-2xl">';html+='<div class="font-bold '+(pi===turn?'text-yellow-300':'opacity-60')+'">GIOCATORE '+(pi+1)+(pi===turn?' - TURNO':'')+'</div>';html+='<div class="text-xs opacity-50 mt-3">CAMPO ('+p.field.length+'):</div><div class="flex flex-wrap gap-1 mt-1">';html+=p.field.map(c=>'<div class="'+INFO.cls+' px-2 py-1 rounded text-xs font-bold">'+INFO.n+'</div>').join('');html+='</div><div class="text-xs opacity-50 mt-3">MANO:</div><div class="flex flex-wrap gap-2 mt-1">';html+=p.hand.map((c,i)=>'<div onclick="playCard('+pi+','+i+')" class="'+INFO.cls+' w-20 h-24 rounded-xl flex flex-col items-center justify-center p-1 cursor-pointer hover:scale-105 border border-white/10"><span class="font-black text-xs">'+INFO.n+'</span><span class="text-xs mt-1 opacity-80 text-center">'+INFO.eff+'</span></div>').join('');html+='</div></div>';});document.getElementById('boards').innerHTML=html;}document.getElementById('settingsBtn').addEventListener('click',openSettings);document.getElementById('closeSettingsBtn').addEventListener('click',closeSettings);document.getElementById('btnPass').addEventListener('click',endTurn);document.getElementById('btnDraw').addEventListener('click',drawCard);document.getElementById('langSelect').addEventListener('change',(e)=>setLang(e.target.value));document.getElementById('settingsModal').addEventListener('click',(e)=>{if(e.target.id==='settingsModal') closeSettings();});document.querySelectorAll('.bgBtn').forEach(b=>{b.addEventListener('click',()=>setBg(b.dataset.bg));});document.getElementById('langSelect').value=curLang;let savedBg=localStorage.getItem('blg_bg');if(savedBg) setBg(savedBg);applyLang();initDeck();</script></body></html>
