<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLG</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet"><style>
body{background:#0b0712;background-size:cover;background-attachment:fixed;font-family:Cinzel,Georgia,serif}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 20% 30%,#7b4bd433,transparent 40%),radial-gradient(circle at 80% 70%,#d4892a26,transparent 40%);animation:mist 18s ease-in-out infinite alternate}
@keyframes mist{to{transform:scale(1.25) translateX(3%);opacity:.6}}
.overlay{background:rgba(6,4,10,.5);height:100vh;height:100dvh;font-family:Cinzel,Georgia,serif}
.title{color:#e8c766;text-shadow:0 0 14px #c9892f,0 2px 0 #000;letter-spacing:.25em}
.panel{background:linear-gradient(#1b1424e6,#0e0a14e6);border:1px solid #6b5426;border-radius:14px;padding:.4rem}
.panel.active{border-color:#f0c75a;box-shadow:0 0 14px #f0c75a66}
.mat{border:2px solid #7a5f2a;border-radius:16px;background:radial-gradient(ellipse at center,#24402f 0%,#0f2218 70%,#08130d 100%);box-shadow:inset 0 0 40px #000c}
.gold{background:linear-gradient(#f6dc8a,#c9962f);border:1px solid #6b5426;color:#2a1a05}
.gold:disabled{filter:grayscale(.7);opacity:.5}
.mcard{width:4.2rem;height:5.9rem;border:2px solid #b8923f;border-radius:8px;padding:3px;display:flex;flex-direction:column;box-shadow:0 3px 8px #000a;color:#111;flex-shrink:0;transition:.15s}
.mcard.sm{width:3.1rem;height:4.4rem}
.ct{font-size:.5rem;font-weight:700;background:rgba(255,255,255,.6);border-radius:3px;padding:1px 2px;text-align:center}
.art{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:2px 0;border:1px solid #0006;border-radius:3px;background:radial-gradient(circle,#fff7,#0003)}
.cty{font-size:.4rem;text-align:center;font-weight:700}
.cx{display:none;font-size:.55rem;background:rgba(255,255,248,.8);border-radius:3px;padding:2px;line-height:1.1;text-align:center}
.mcard[onclick]{cursor:pointer}.mcard[onclick]:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 8px 16px #000c,0 0 12px #f0c75a}
.l-R{background:linear-gradient(160deg,#ee7b58,#7a1d12)}.l-B{background:linear-gradient(160deg,#8c7a99,#1d1226)}.l-G{background:linear-gradient(160deg,#6fbf6a,#14411c)}.l-U{background:linear-gradient(160deg,#6ab4ee,#0f3a78)}.l-W{background:linear-gradient(160deg,#fff6d6,#cdb87a)}
.l-B .ct,.l-B .cty{color:#111}
.cback{width:2.2rem;height:3.1rem;border:2px solid #b8923f;border-radius:6px;flex-shrink:0;background:repeating-linear-gradient(45deg,#3b2a14,#3b2a14 4px,#5a3f1c 4px,#5a3f1c 8px)}
@media(min-width:640px){.mcard{width:6.6rem;height:9.2rem;padding:5px}.mcard.sm{width:4.4rem;height:6.2rem}.ct{font-size:.7rem}.art{font-size:2.4rem}.cty{font-size:.55rem}.cx{display:block}.mcard.sm .cx{display:none}.cback{width:3.2rem;height:4.5rem}}
</style></head>
<body id="body"><div class="overlay p-2  text-white"><div class="w-full max-w-3xl mx-auto h-full flex flex-col gap-2 text-center">
<div class="shrink-0 relative text-center"><div><h1 class="title text-4xl font-black leading-none">BLG</h1><div class="text-indigo-300 text-xs font-bold tracking-widest">BASIC LAND GAME</div><div class="text-[10px] opacity-60" id="sub"></div></div>
<button id="settingsBtn" type="button" class="absolute right-0 top-0 bg-zinc-800 border border-white/20 px-3 py-2 rounded-xl text-sm">⚙️</button></div>
<div id="zone1" class="shrink-0"></div>
<div class="mat flex-1 min-h-0 flex flex-col justify-between p-2 overflow-auto">
<div id="field1" class="flex flex-wrap justify-center gap-1 content-center min-h-[4.7rem] sm:min-h-[6.5rem]"></div>
<div class="my-1 flex flex-wrap justify-center items-center gap-x-6 gap-y-1 bg-black/50 rounded-xl px-3 py-1"><div><div class="text-[10px] opacity-60" id="lblTurn"></div><div id="turnLabel" class="text-2xl font-black text-yellow-300 leading-none">G1</div></div><div class="text-[10px] text-center"><div id="dropLabel"></div><div class="opacity-60"><span id="lblDeck"></span>: <span id="deckCount">0</span></div></div><button id="btnPass" type="button" class="gold font-bold px-5 py-2 rounded-xl"></button></div>
<div id="field0" class="flex flex-wrap justify-center gap-1 content-center min-h-[4.7rem] sm:min-h-[6.5rem]"></div></div>
<div id="zone0" class="shrink-0"></div>
<div id="log" class="shrink-0 bg-black/80 rounded-xl p-2 h-16 sm:h-20 overflow-auto text-xs opacity-80 text-center"></div></div></div>

<div id="settingsModal" style="display:none" class="fixed inset-0 bg-black/80 items-center justify-center z-40 p-4"><div class="bg-zinc-900 border border-yellow-700/60 rounded-2xl max-w-md w-full p-6 text-white max-h-[90vh] overflow-auto">
<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">SETTINGS</h2><button id="closeSettingsBtn" type="button" class="text-2xl opacity-60">✕</button></div>
<label class="text-xs opacity-60 uppercase">Language</label><select id="langSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="it">Italiano</option><option value="en">English</option></select>
<label class="text-xs opacity-60 uppercase" id="lblSize"></label><select id="sizeSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="25">25</option><option value="50">50</option></select>
<label class="text-xs opacity-60 uppercase" id="lblHand"></label><select id="handSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="3">3</option><option value="5">5</option></select>
<label class="text-xs opacity-60 uppercase" id="lblDiff"></label><select id="diffSelect" class="w-full mt-1 mb-4 bg-black border border-white/20 rounded-xl p-2"><option value="nabbo">Nabbo</option><option value="normie">Normie</option><option value="pro">Proplayer</option></select>
<button id="musicBtn" type="button" class="w-full bg-zinc-800 border border-yellow-700/60 rounded-xl p-2 mb-2"></button><button id="sfxBtn" type="button" class="w-full bg-zinc-800 border border-yellow-700/60 rounded-xl p-2 mb-4"></button>
<label class="text-xs opacity-60 uppercase">Background</label><div class="grid grid-cols-3 gap-2 mt-2" id="bgGrid"></div></div></div>

<div id="choiceModal" style="display:none" class="fixed inset-0 bg-black/85 items-center justify-center z-50 p-4"><div class="bg-zinc-900 border border-yellow-300/50 rounded-2xl max-w-md w-full p-6  text-white"><div id="choiceTitle" class="font-bold mb-4"></div><div id="choiceOpts"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const S={it:{sub:'5 diverse o 5 uguali per vincere',type:'Terra Base',diff:'Difficoltà',musicL:'Musica',sfxL:'Effetti sonori',pc:'PC',you:'TU',turn:'TURNO ATTUALE',pass:'PASSA',deck:'Mazzo',size:'Carte nel mazzo',hand:'Mano iniziale',dropN:'Terra giocata: NO',dropY:'Terra giocata: SÌ',field:'CAMPO',handL:'MANO',grave:'CIMITERO',player:'GIOCATORE',newgame:'Nuova partita',draws:'pesca',plays:'gioca',already:'Puoi giocare una sola terra per turno',counter:'vuoi contrastare con Isola? (scarti Isola + 1 carta)',yes:'Sì',no:'No',disc2:'Scegli la carta da scartare insieme all\'Isola',countered:'contrasta l\'effetto con Isola!',pickLand:'Scegli la terra avversaria da distruggere',noTarget:'nessun bersaglio',destroyed:'distrutta',swamp:'Palude: scegli quale carta fa scartare (mano avversaria)',discarded:'scarta',noCards:'nessuna carta',forest:'Foresta: scegli la terra da riprendere',back:'riprende',scry:'Scry 1 - carta in cima:',top:'Tieni in cima',bottom:'Metti in fondo',deckEmpty:'Mazzo finito',winD:'VINCE! 5 terre diverse (Domain)!',winS:'VINCE! 5 terre uguali:',again:'Nuova partita',hidden:'carte coperte',
n:{R:'MONTAGNA',B:'PALUDE',G:'FORESTA',U:'ISOLA',W:'PIANURA'},e:{R:'Distrugge una terra avversaria',B:'L\'avversario mostra 3 carte e ne scarta 1',G:'Riprendi una terra dal cimitero',U:'Scry 1 / Contrasta (scarta con 1 carta)',W:'Pesca una carta'}},
en:{sub:'5 different or 5 equal to win',type:'Basic Land',diff:'Difficulty',musicL:'Music',sfxL:'Sound effects',pc:'PC',you:'YOU',turn:'CURRENT TURN',pass:'PASS',deck:'Deck',size:'Deck size',hand:'Starting hand',dropN:'Land played: NO',dropY:'Land played: YES',field:'FIELD',handL:'HAND',grave:'GRAVEYARD',player:'PLAYER',newgame:'New game',draws:'draws',plays:'plays',already:'Only one land per turn',counter:'counter with Island? (discard Island + 1 card)',yes:'Yes',no:'No',disc2:'Choose the card to discard with the Island',countered:'counters the effect with Island!',pickLand:'Choose the opponent land to destroy',noTarget:'no target',destroyed:'destroyed',swamp:'Swamp: choose which card to discard (opponent hand)',discarded:'discards',noCards:'no cards',forest:'Forest: choose a land to return',back:'returns',scry:'Scry 1 - top card:',top:'Keep on top',bottom:'Put on bottom',deckEmpty:'Deck empty',winD:'WINS! 5 different lands (Domain)!',winS:'WINS! 5 of a kind:',again:'New game',hidden:'hidden cards',
n:{R:'MOUNTAIN',B:'SWAMP',G:'FOREST',U:'ISLAND',W:'PLAINS'},e:{R:'Destroy an opponent land',B:'Opp. reveals 3 cards, discards 1',G:'Return a land from graveyard',U:'Scry 1 / Counter (discard with 1 card)',W:'Draw a card'}}};
const CLS={R:'bg-red-600',B:'bg-stone-700',G:'bg-green-700',U:'bg-blue-600',W:'bg-amber-100 text-black'};
const BG={default:'radial-gradient(ellipse at 50% 0%,#3a2457 0%,#120a1c 55%,#050308 100%)',plains:'linear-gradient(#f8f1d0,#c9b97a)',island:'linear-gradient(#1e5fa8,#0a2a52)',swamp:'linear-gradient(#3a2f3f,#0c0810)',mountain:'linear-gradient(#c0392b,#4a0f0a)',forest:'linear-gradient(#2e7d32,#0b2a10)'};
const store={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('blg_lang','it'),cfg={size:+store.get('blg_size',25),hand:+store.get('blg_hand',5),diff:store.get('blg_diff','normie')};
let deck=[],P=[],turn=0,dropped=false,over=false,gid=0;

// ---------- AUDIO (sintetizzato con WebAudio, nessun file esterno) ----------
let AC=null,mGain=null,mTimer=null,mi=0,musicOn=store.get('blg_music','1')==='1',sfxOn=store.get('blg_sfx','1')==='1';
const CH=[[110,164.81,220],[87.31,130.81,174.61],[130.81,196,261.63],[98,146.83,196]],PENT=[220,261.63,293.66,329.63,392,440,523.25,587.33,659.25];
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();mGain=AC.createGain();mGain.gain.value=musicOn?.5:0;mGain.connect(AC.destination);
 const l=AC.sampleRate*2.5,b=AC.createBuffer(2,l,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3);}
 const r=AC.createConvolver();r.buffer=b;const w=AC.createGain();w.gain.value=.7;mGain.connect(r);r.connect(w);w.connect(AC.destination);}
 if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t,d,type,v,dest,f2){const a=ac();if(!a)return;const n=a.currentTime+t,o=a.createOscillator(),g=a.createGain(),at=d>5?2:Math.min(.05,d/4);
 o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
 g.gain.setValueAtTime(0.0001,n);g.gain.linearRampToValueAtTime(v,n+at);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(dest||a.destination);o.start(n);o.stop(n+d+.05);}
const SFX={draw:()=>{tone(520,0,.08,'triangle',.15);tone(780,.07,.1,'triangle',.12);},
 play:()=>{tone(160,0,.25,'sine',.4,null,60);tone(700,.02,.08,'triangle',.1);},
 destroy:()=>tone(500,0,.5,'sawtooth',.18,null,60),discard:()=>tone(260,0,.5,'square',.09,null,70),
 recover:()=>[330,415,523].forEach((f,i)=>tone(f,i*.1,.25,'triangle',.15)),
 chime:()=>{tone(880,0,.5,'sine',.15);tone(1320,.1,.6,'sine',.1);},
 counter:()=>tone(1000,0,.35,'square',.12,null,180),pass:()=>tone(330,0,.15,'triangle',.15,null,220),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.16,.5,'triangle',.2)),
 lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,i*.2,.5,'sawtooth',.1))};
function sfx(n){if(sfxOn&&ac())SFX[n]();}
function musicTick(){if(!musicOn||!ac())return;const ch=CH[mi++%4];ch.forEach(f=>tone(f,0,9,'sine',.07,mGain));tone(ch[0]/2,0,9,'triangle',.06,mGain);
 for(let k=0;k<4;k++)tone(PENT[Math.floor(Math.random()*PENT.length)],k*2+Math.random(),3,'triangle',.05,mGain);}
function setMusic(){if(!ac())return;mGain.gain.value=musicOn?.5:0;if(musicOn&&!mTimer){musicTick();mTimer=setInterval(musicTick,8000);}if(!musicOn&&mTimer){clearInterval(mTimer);mTimer=null;}}
function audioBtns(){$('musicBtn').textContent='🎵 '+s('musicL')+': '+(musicOn?'ON':'OFF');$('sfxBtn').textContent='🔊 '+s('sfxL')+': '+(sfxOn?'ON':'OFF');}
function aiCounter(card){const d=cfg.diff;if(d==='nabbo')return Math.random()<.2;if(d==='pro'){const f=P[0].field,cn={};f.forEach(c=>cn[c]=(cn[c]||0)+1);const th=Math.max(0,...Object.values(cn))>=3||Object.keys(cn).length>=3;return th||card==='R'||card==='B'||Math.random()<.7;}return card==='R'||card==='B'||Math.random()<.5;}
function card(c,small,attr){const SYM={R:'🔥',B:'💀',G:'🌲',U:'💧',W:'☀️'};return '<div '+(attr||'')+' class="mcard '+(small?'sm ':'')+'l-'+c+'"><div class="ct">'+nm(c)+'</div><div class="art">'+SYM[c]+'</div><div class="cty">'+s('type')+'</div><div class="cx">'+S[lang].e[c]+'</div></div>';}
const gn=i=>i?s('pc'):s('you');
function aiLater(fn,ms,force){const g=gid;setTimeout(()=>{if(g===gid&&(force||!over))fn();},ms);}
function pickDup(pl,o){const f=P[pl].field,h=P[pl].hand;const x=o.find(k=>f.includes(h[k.val]));return (x||o[Math.floor(Math.random()*o.length)]).val;}
const s=k=>S[lang][k], nm=c=>S[lang].n[c];

function log(t){const el=$('log');el.innerHTML='> '+t+'<br>'+el.innerHTML;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function choose(title,opts,cb,who,best){if(who===1){const v=best&&cfg.diff!=='nabbo'?best(opts):opts[Math.floor(Math.random()*opts.length)].val;return aiLater(()=>cb(v),700,true);}const m=$('choiceModal');$('choiceTitle').textContent=title;const box=$('choiceOpts');box.innerHTML='';
 opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='w-full bg-zinc-800 border border-white/20 rounded-xl p-3 mb-2 text-left';b.textContent=o.label;b.onclick=()=>{m.style.display='none';cb(o.val);};box.appendChild(b);});m.style.display='flex';}

function initDeck(){gid++;
 const per=cfg.size/5;deck=[];['R','B','G','U','W'].forEach(c=>{for(let i=0;i<per;i++)deck.push(c);});shuffle(deck);
 P=[{hand:[],field:[],grave:[]},{hand:[],field:[],grave:[]}];
 for(let p=0;p<2;p++)for(let i=0;i<cfg.hand;i++)P[p].hand.push(deck.pop());
 turn=0;dropped=false;over=false;$('log').innerHTML='';log(s('newgame')+' ('+cfg.size+' / '+cfg.hand+')');render();}
function draw(p){if(!deck.length){log(s('deckEmpty'));return;}P[p].hand.push(deck.pop());sfx('draw');}

function playCard(idx,isAI){
 if(over||$('choiceModal').style.display==='flex')return;
 if(!isAI&&turn!==0)return;
 if(dropped){log(s('already'));return;}
 const me=P[turn],oi=1-turn,opp=P[oi],card=me.hand.splice(idx,1)[0];
 me.field.push(card);dropped=true;sfx('play');log(gn(turn)+' '+s('plays')+' '+nm(card));
 const done=()=>{checkWin();render();if(turn===1&&!over)aiLater(()=>endTurn(true),900);};
 // Isola dell'avversario: contrasta l'effetto (la terra resta in gioco)
 if(opp.hand.includes('U')&&opp.hand.length>=2){
  choose(gn(oi)+': '+s('counter'),[{label:s('yes'),val:1},{label:s('no'),val:0}],v=>{
   if(!v)return etb(card,me,opp,done);
   opp.grave.push(opp.hand.splice(opp.hand.indexOf('U'),1)[0]);
   choose(s('disc2'),opp.hand.map((c,i)=>({label:nm(c),val:i})),i=>{opp.grave.push(opp.hand.splice(i,1)[0]);log(gn(oi)+' '+s('countered'));sfx('counter');done();},oi,o=>pickDup(oi,o));
  },oi,()=>aiCounter(card)?1:0);
 }else etb(card,me,opp,done);
}

function etb(card,me,opp,done){
 if(card==='W'){draw(turn);log(gn(turn)+' '+s('draws'));return done();}
 if(card==='U'){if(!deck.length)return done();sfx('chime');const top=deck[deck.length-1];
  return choose(s('scry')+' '+nm(top),[{label:s('top'),val:0},{label:s('bottom'),val:1}],v=>{if(v)deck.unshift(deck.pop());done();},turn,()=>P[turn].field.includes(top)?1:0);}
 if(card==='R'){if(!opp.field.length){log(s('noTarget'));return done();}
  return choose(s('pickLand'),opp.field.map((c,i)=>({label:nm(c),val:i})),i=>{const c=opp.field.splice(i,1)[0];opp.grave.push(c);log(nm(c)+' '+s('destroyed'));sfx('destroy');done();},turn,o=>{const f=opp.field,n=k=>f.filter(x=>x===f[k.val]).length;let b=o[0];o.forEach(k=>{if(n(k)>n(b))b=k;});return b.val;});}
 if(card==='B'){if(!opp.hand.length){log(s('noCards'));return done();}
  const idxs=shuffle(opp.hand.map((c,i)=>i)).slice(0,3);
  return choose(s('swamp'),idxs.map(i=>({label:nm(opp.hand[i]),val:i})),i=>{const c=opp.hand.splice(i,1)[0];opp.grave.push(c);log(gn(P.indexOf(opp))+' '+s('discarded')+' '+nm(c));sfx('discard');done();},turn,o=>{const x=o.find(k=>!opp.field.includes(opp.hand[k.val]));return (x||o[0]).val;});}
 if(card==='G'){const types=[...new Set(me.grave)];if(!types.length){log(s('noCards'));return done();}
  return choose(s('forest'),types.map(c=>({label:nm(c),val:c})),c=>{me.grave.splice(me.grave.lastIndexOf(c),1);me.hand.push(c);log(gn(turn)+' '+s('back')+' '+nm(c));sfx('recover');done();},turn,o=>{const x=o.find(k=>!me.field.includes(k.val));return (x||o[0]).val;});}
 done();}

function checkWin(){
 const f=P[turn].field,cnt={};f.forEach(c=>cnt[c]=(cnt[c]||0)+1);
 let msg=null;
 if(Object.keys(cnt).length>=5)msg=s('winD');
 else for(const k in cnt)if(cnt[k]>=5)msg=s('winS')+' '+nm(k);
 if(msg){over=true;sfx(turn===0?'win':'lose');choose(gn(turn)+' '+msg,[{label:s('again'),val:1}],initDeck);}}

function endTurn(fromAI){
 if(over||$('choiceModal').style.display==='flex')return;
 if(fromAI!==true&&turn!==0)return;
 turn=1-turn;dropped=false;log('--- '+gn(turn)+' ---');sfx('pass');draw(turn);render();if(turn===1)aiLater(aiTurn,900);}
function aiTurn(){
 if(over||turn!==1)return;const h=P[1].hand,f=P[1].field;
 if(!h.length)return aiLater(()=>endTurn(true),700);
 const d=cfg.diff;if(d==='nabbo'){playCard(Math.floor(Math.random()*h.length),true);return;}
 let best=-1,bi=0;
 h.forEach((c,i)=>{let sc=(d==='pro'?Math.random()*.3:Math.random())+f.filter(x=>x===c).length*.8;if(!f.includes(c))sc+=2;if(c==='R'&&P[0].field.length)sc+=1;if(c==='B'&&P[0].hand.length)sc+=.5;if(d==='pro'&&c==='R'&&new Set(P[0].field).size>=3)sc+=3;if(c==='G'&&P[1].grave.length)sc+=.5;if(c==='W'&&deck.length)sc+=.3;if(sc>best){best=sc;bi=i;}});
 playCard(bi,true);}

function fcard(c){return card(c,true);}
function zone(pi){const p=P[pi],me=pi===turn;
 let h='<div class="panel'+(me?' active':'')+'"><div class="flex flex-col items-center text-xs text-center"><span class="font-bold '+(me?'text-yellow-300':'opacity-60')+'">'+(pi?s('pc'):s('you'))+(me?' ◀':'')+' · '+s('handL')+' ('+p.hand.length+')</span><span class="opacity-60 text-[10px] sm:text-xs break-words max-w-full">'+s('grave')+' ('+p.grave.length+'): '+p.grave.map(nm).join(', ')+'</span></div><div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mt-1 min-h-[6.5rem] sm:min-h-[9.5rem] items-end">';
 h+=pi===0?p.hand.map((c,i)=>card(c,false,'onclick="playCard('+i+')"')).join(''):p.hand.map(()=>'<div class="cback"></div>').join('');
 return h+'</div></div>';}
function render(){
 $('sub').textContent=s('sub');$('lblTurn').textContent=s('turn');$('btnPass').textContent=s('pass');$('btnPass').disabled=turn!==0;$('btnPass').classList.toggle('opacity-40',turn!==0);$('lblDeck').textContent=s('deck');
 $('lblSize').textContent=s('size');$('lblDiff').textContent=s('diff');audioBtns();$('lblHand').textContent=s('hand');
 $('deckCount').textContent=deck.length;$('turnLabel').textContent=gn(turn);$('dropLabel').textContent=dropped?s('dropY'):s('dropN');
 $('zone1').innerHTML=zone(1);$('zone0').innerHTML=zone(0);
 $('field1').innerHTML=P[1].field.map(fcard).join('');$('field0').innerHTML=P[0].field.map(fcard).join('');}

function setBg(n){$('body').style.background=BG[n]||BG.default;$('body').style.backgroundSize='cover';$('body').style.backgroundAttachment='fixed';store.set('blg_bg',n);}
$('bgGrid').innerHTML=Object.keys(BG).map(k=>'<button type="button" data-bg="'+k+'" class="bgBtn rounded-xl h-16 border-2 border-white/20 text-xs font-bold" style="background:'+BG[k]+';color:'+(k==='plains'?'#000':'#fff')+'">'+k.toUpperCase()+'</button>').join('');
document.querySelectorAll('.bgBtn').forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.bg)));
$('settingsBtn').addEventListener('click',()=>$('settingsModal').style.display='flex');
const closeS=()=>$('settingsModal').style.display='none';
$('closeSettingsBtn').addEventListener('click',closeS);
$('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeS();});
$('btnPass').addEventListener('click',()=>endTurn());
$('langSelect').addEventListener('change',e=>{lang=e.target.value;store.set('blg_lang',lang);render();});
$('sizeSelect').addEventListener('change',e=>{cfg.size=+e.target.value;store.set('blg_size',cfg.size);initDeck();});
$('handSelect').addEventListener('change',e=>{cfg.hand=+e.target.value;store.set('blg_hand',cfg.hand);initDeck();});
$('musicBtn').addEventListener('click',()=>{musicOn=!musicOn;store.set('blg_music',musicOn?'1':'0');setMusic();audioBtns();});
$('sfxBtn').addEventListener('click',()=>{sfxOn=!sfxOn;store.set('blg_sfx',sfxOn?'1':'0');audioBtns();if(sfxOn)sfx('chime');});
$('diffSelect').addEventListener('change',e=>{cfg.diff=e.target.value;store.set('blg_diff',cfg.diff);});
document.addEventListener('pointerdown',()=>{if(musicOn)setMusic();},{once:true});
$('diffSelect').value=cfg.diff;$('langSelect').value=lang;$('sizeSelect').value=cfg.size;$('handSelect').value=cfg.hand;
setBg(store.get('blg_bg','default'));initDeck();
</script></body></html>
