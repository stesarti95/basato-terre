body{background:#0b0712;background-size:cover;background-attachment:fixed;font-family:Cinzel,Georgia,serif}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 20% 30%,#7b4bd433,transparent 40%),radial-gradient(circle at 80% 70%,#d4892a26,transparent 40%),radial-gradient(circle at 50% 100%,#1e6a8a26,transparent 45%);animation:mist 18s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(1px 1px at 20% 30%,#fffc,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#ffe9a8,transparent),radial-gradient(1px 1px at 40% 80%,#fffc,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#bfe0ff,transparent),radial-gradient(1px 1px at 10% 70%,#fffc,transparent),radial-gradient(1px 1px at 55% 45%,#fff9,transparent);animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:.9}}@keyframes mist{to{transform:scale(1.25) translateX(3%);opacity:.6}}
.overlay{background:rgba(6,4,10,.42);height:100vh;height:100dvh}
.title{font-family:'Cinzel Decorative',Cinzel,serif;background:linear-gradient(#fff3b8,#e0a93a 55%,#8a5a14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #c9892f);letter-spacing:.25em}
.panel{background:linear-gradient(#1d1530f2,#0d0916f2);border:2px solid #7a5f2a;border-radius:14px;padding:.4rem;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 0 1px #2a1d08}
.panel.active{border-color:#f0c75a;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 18px #f0c75a88}
.panel.pc.active{border-color:#e0584a;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000b,0 0 18px #e0584a88}
.panel:not(.active){filter:saturate(.6) brightness(.8)}
.mat{position:relative;border:2px solid #7a5f2a;border-radius:16px;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 3.2rem,#e8c76614 3.2rem calc(3.2rem + 1px)),radial-gradient(ellipse at center,#2a2347 0%,#15102a 60%,#090618 100%);box-shadow:inset 0 0 50px #000,0 0 22px #6a3fd144}
.gold{background:linear-gradient(#f6dc8a,#c9962f 60%,#a8771c);border:1px solid #6b5426;color:#2a1a05;box-shadow:0 0 10px #c9962f55,inset 0 1px 0 #fff8}.gold:disabled{filter:grayscale(.7);opacity:.5}
.pname{font-weight:900;font-size:1rem;letter-spacing:.2em;opacity:.45}.pname.on{opacity:1;font-size:1.35rem;color:#ffe08a;text-shadow:0 0 12px #f0c75a}.pc .pname.on{color:#ff9d8f;text-shadow:0 0 12px #e0584a}
.turnbadge{background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;font-weight:900;font-size:.7rem;padding:.2rem .7rem;border-radius:999px;letter-spacing:.08em;animation:pulse 1.4s ease-in-out infinite}.pc .turnbadge{background:linear-gradient(#f0907f,#a8352a);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 14px #f0c75a;transform:scale(1.07)}}
.sideon{background:radial-gradient(ellipse at center,#f0c75a24,transparent 70%);border-radius:12px}
#field0:empty::after,#field1:empty::after{content:'· · ·';opacity:.2;letter-spacing:.5em}
/* ---- carte ---- */
.mcard{container-type:inline-size;position:relative;width:4.2rem;height:5.8rem;border-radius:9px;padding:3px;display:flex;flex-direction:column;border:2px solid #0a0a0a;box-shadow:0 0 0 1px #b8923f,0 4px 10px #000c;flex-shrink:0;transition:.15s;overflow:hidden;color:#1a1208}
.mcard::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff44 48%,transparent 60%);transform:translateX(-120%);transition:.7s}.mcard:hover::after{transform:translateX(120%)}
.l-R{background:linear-gradient(160deg,#e8704a,#6a1a0f)}.l-B{background:linear-gradient(160deg,#8c7a99,#1d1226)}.l-G{background:linear-gradient(160deg,#6fbf6a,#14411c)}.l-U{background:linear-gradient(160deg,#6ab4ee,#0f3a78)}.l-W{background:linear-gradient(160deg,#fff6d6,#cdb87a)}
.ct,.cty,.cx{background:linear-gradient(#f4ecd3,#d9ca9d);border:1px solid #0007;border-radius:3px;text-align:center;overflow:hidden;color:#1a1208}
.ct{font-weight:900;font-size:12cqw;white-space:nowrap;padding:1px 2px}.cty{font-size:8cqw;font-weight:700;white-space:nowrap;margin-top:2px}.cx{font-size:10cqw;line-height:1.1;padding:1px 2px;margin-top:2px;max-height:2.7em;overflow-wrap:anywhere}
.art{position:relative;flex:1;min-height:0;margin:2px 0;border:1px solid #000;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 8px #000a}
.art::before{content:'';position:absolute;left:0;right:0;bottom:0;height:52%}
.l-R .art{background:linear-gradient(#ffb36b,#c4361e 60%,#4a0f08)}.l-R .art::before{background:#2a0a06;clip-path:polygon(0 100%,0 60%,18% 25%,32% 62%,52% 8%,70% 58%,85% 30%,100% 62%,100% 100%)}
.l-B .art{background:linear-gradient(#6f5a82,#2a1b3a 60%,#0d0714)}.l-B .art::before{background:#08040c;clip-path:polygon(0 100%,0 70%,12% 40%,16% 70%,30% 55%,42% 20%,48% 70%,66% 50%,80% 25%,86% 68%,100% 55%,100% 100%)}
.l-G .art{background:linear-gradient(#bfe89a,#3d9a45 60%,#123d1a)}.l-G .art::before{background:#082310;clip-path:polygon(0 100%,0 55%,10% 20%,20% 55%,28% 55%,40% 10%,52% 55%,60% 55%,75% 22%,88% 58%,100% 45%,100% 100%)}
.l-U .art{background:linear-gradient(#bfe4ff,#3f8fe0 55%,#0b2f66)}.l-U .art::before{background:#07204a;clip-path:polygon(0 100%,0 55%,12% 40%,25% 55%,38% 40%,50% 55%,62% 40%,75% 55%,88% 40%,100% 55%,100% 100%)}
.l-W .art{background:linear-gradient(#fffbe6,#f3d98a 60%,#bf9c4a)}.l-W .art::before{background:#8a6a24;clip-path:polygon(0 100%,0 60%,25% 35%,55% 55%,80% 30%,100% 50%,100% 100%)}
.mana{position:relative;z-index:1;width:66cqw;aspect-ratio:1;background-size:contain;background-position:center;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px #000b)}

.mcard.sm{width:4.2rem;height:5.8rem}.mcard.xs{width:2.7rem;height:3.8rem}.mcard.xxs{width:2.1rem;height:3rem}.mcard.lg{width:min(62vw,13rem);height:calc(min(62vw,13rem)*1.4)}
.mcard.xs .ct,.mcard.xs .cty,.mcard.xs .cx,.mcard.xxs .ct,.mcard.xxs .cty,.mcard.xxs .cx{display:none}.mcard.xs .mana,.mcard.xxs .mana{width:75cqw;font-size:42cqw}
@media(min-width:640px){.mcard{width:6.6rem;height:9.2rem}.mcard.sm{width:5.4rem;height:7.6rem}.mcard.xs{width:3.8rem;height:5.3rem}.mcard.xxs{width:3rem;height:4.2rem}.mcard.lg{width:13rem;height:18.2rem}}
.mcard[onclick]{cursor:pointer}.mcard[onclick]:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 0 0 1px #f0c75a,0 8px 16px #000c,0 0 14px #f0c75a;z-index:3}
.hand{gap:0!important}.hand .mcard+.mcard{margin-left:-.35rem}@media(min-width:640px){.hand{gap:.5rem!important}.hand .mcard+.mcard{margin-left:0}}
.cback{width:2.2rem;height:3.1rem;border:2px solid #b8923f;border-radius:6px;flex-shrink:0;background:radial-gradient(circle,#e8c76666 0 16%,transparent 18%),repeating-linear-gradient(45deg,#2b1a3f,#2b1a3f 4px,#43295f 4px,#43295f 8px)}
.cback.opp{width:1.5rem;height:2.1rem;margin-left:-.5rem;border-radius:4px}.cback.opp:first-child{margin-left:0}
@media(min-width:640px){.cback.opp{width:2.2rem;height:3.1rem}}
/* ---- animazioni ---- */
@keyframes enter{0%{transform:translateY(130px) scale(1.8) rotate(-8deg);opacity:0;filter:brightness(2.2)}55%{opacity:1}100%{transform:none;filter:none}}
@keyframes enter2{0%{transform:translateY(-130px) scale(1.8) rotate(8deg);opacity:0;filter:brightness(2.2)}55%{opacity:1}100%{transform:none;filter:none}}
@keyframes die{0%{filter:brightness(3) saturate(2);transform:scale(1.1)}30%{transform:scale(1.18) rotate(4deg);filter:brightness(1.6) sepia(1) hue-rotate(-30deg)}100%{transform:scale(.35) rotate(20deg) translateY(30px);opacity:0;filter:blur(3px) grayscale(1)}}
.enter{animation:enter .55s cubic-bezier(.2,1.3,.4,1)}.enter2{animation:enter2 .55s cubic-bezier(.2,1.3,.4,1)}.dying{animation:die .65s ease-in forwards;pointer-events:none}
@keyframes drawn{0%{transform:translateY(-260px) scale(.4) rotate(-14deg);opacity:0}25%{opacity:1}100%{transform:none}}@keyframes drawn2{0%{transform:translateY(260px) scale(.6) rotate(10deg);opacity:0}25%{opacity:1}100%{transform:none}}
.drawn{animation:drawn .6s cubic-bezier(.2,1,.4,1)}.drawn2{animation:drawn2 .6s cubic-bezier(.2,1,.4,1)}
@keyframes deckpulse{0%{transform:scale(1)}35%{transform:scale(1.25);filter:drop-shadow(0 0 12px #8fd0ff)}100%{transform:scale(1)}}.deckpulse{animation:deckpulse .6s ease-out}
@keyframes pk{50%{transform:scale(1.08)}}.pickable{cursor:pointer;animation:pk 1s ease-in-out infinite;box-shadow:0 0 14px 3px #ffd54a!important;border-color:#ffe08a!important}.dim{opacity:.35;filter:grayscale(.7)}
/* ---- mazzo, cimiteri, avvisi ---- */
.pilepos{position:absolute;top:50%;transform:translateY(-50%);z-index:5}.pr{right:.15rem}.pl{left:.15rem}.fld{padding:0 3rem}
.pile,.dpile{position:relative;width:2.6rem;height:3.6rem;border-radius:6px}.pile{cursor:pointer;border:1.5px dashed #b8923f;display:flex;align-items:center;justify-content:center;background:#0006}
.pile .mcard{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-5deg)}.pempty{opacity:.3;font-size:1.2rem}
.dback{width:100%;height:100%;border:2px solid #b8923f;border-radius:6px;background:radial-gradient(circle,#e8c76677 0 16%,transparent 18%),repeating-linear-gradient(45deg,#2b1a3f,#2b1a3f 4px,#43295f 4px,#43295f 8px);box-shadow:2px 2px 0 #2b1a3f,4px 4px 0 #1a0f28,5px 5px 8px #000a}
.pcount{position:absolute;right:-.1rem;bottom:-.3rem;background:#0b0712;border:1px solid #b8923f;color:#ffe08a;font-size:.65rem;font-weight:900;border-radius:999px;min-width:1.2rem;height:1.2rem;display:flex;align-items:center;justify-content:center}
@media(min-width:640px){.pile,.dpile{width:3.6rem;height:5rem}.pcount{font-size:.75rem}.fld{padding:0 4.4rem}}
#pickBar{position:fixed;top:.5rem;left:50%;transform:translateX(-50%);z-index:30;background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;font-weight:900;padding:.4rem 1rem;border-radius:999px;box-shadow:0 0 18px #f0c75a;font-size:.8rem;max-width:90vw;text-align:center;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
.ldlogo{height:.8rem;width:auto;mix-blend-mode:screen}
.casting{opacity:.85;animation:castp 1s ease-in-out infinite;box-shadow:0 0 18px 4px #8fd0ff!important}@keyframes castp{50%{transform:scale(1.07);filter:brightness(1.4)}}
#toast{white-space:pre-line;position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:35;pointer-events:none;font-weight:900;font-size:1.2rem;color:#fff;text-shadow:0 0 14px #8f6bff,0 0 3px #000;padding:.5rem 1.2rem;border-radius:14px;background:#140a2ae6;border:2px solid #b8923f;text-align:center;max-width:90vw;animation:toast 1.7s ease-out forwards}
.blglogo{height:3.2rem;width:auto;-webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);filter:drop-shadow(0 0 10px #6a3fd1aa)}
@media(min-width:640px){.blglogo{height:4.2rem}}
.mat.turn0{border-color:#f0c75a;box-shadow:inset 0 0 50px #000,0 0 26px #f0c75a77}.mat.turn1{border-color:#e0584a;box-shadow:inset 0 0 50px #000,0 0 26px #e0584a77}
.turnline{display:flex;align-items:center;gap:.5rem}.tl-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.7}
.tl-pill{font-weight:900;letter-spacing:.15em;font-size:.85rem;padding:.25rem 1.1rem;border-radius:999px;border:2px solid;animation:pulse 1.4s ease-in-out infinite;white-space:nowrap}
.turnline.t0{color:#f0c75a}.t0 .tl-pill{background:linear-gradient(#f6dc8a,#c9962f);color:#2a1a05;border-color:#fff3b8;box-shadow:0 0 16px #f0c75a}
.turnline.t1{color:#e0584a}.t1 .tl-pill{background:linear-gradient(#f0907f,#a8352a);color:#fff;border-color:#ffb3a6;box-shadow:0 0 16px #e0584a}
@media(min-width:640px){.tl-pill{font-size:1.05rem}}
.askbar{margin-top:.3rem;padding:.35rem .5rem;border:2px solid #ffd54a;border-radius:10px;background:#2a1d08;box-shadow:0 0 14px #ffd54a88;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35rem .8rem}
.asktxt{font-size:.72rem;font-weight:700;color:#ffe9a8;line-height:1.2}.askbtns{display:flex;gap:.5rem}.askno{background:#3a1d1d;border:1px solid #a8352a;color:#ffb3a6}

function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();mGain=AC.createGain();mGain.gain.value=musicOn?.5:0;mGain.connect(AC.destination);
 const l=AC.sampleRate*2.5,b=AC.createBuffer(2,l,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3);}
 const r=AC.createConvolver();r.buffer=b;const w=AC.createGain();w.gain.value=.9;mGain.connect(r);r.connect(w);w.connect(AC.destination);}
 if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t,d,type,v,dest,f2,lp,det){const a=ac();if(!a)return;const n=a.currentTime+t,o=a.createOscillator(),g=a.createGain(),at=d>5?2:Math.min(.05,d/4);
 o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);if(det)o.detune.value=det;
 g.gain.setValueAtTime(0.0001,n);g.gain.linearRampToValueAtTime(v,n+at);g.gain.exponentialRampToValueAtTime(.0001,n+d);
 if(lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g);}else o.connect(g);
 g.connect(dest||a.destination);o.start(n);o.stop(n+d+.05);}
function noise(t,d,v,fc,type){const a=ac();if(!a)return;const n=a.currentTime+t,len=Math.ceil(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);
 for(let i=0;i<len;i++)x[i]=Math.random()*2-1;const r=a.createBufferSource();r.buffer=b;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=fc;
 const g=a.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);r.connect(f);f.connect(g);g.connect(a.destination);r.start(n);}

function setMusic(){if(!ac())return;mGain.gain.value=musicOn?.5:0;if(musicOn&&!mTimer){musicTick();mTimer=setInterval(musicTick,8000);}if(!musicOn&&mTimer){clearInterval(mTimer);mTimer=null;}}
function audioBtns(){$('musicBtn').textContent='🎵 '+s('musicL')+': '+(musicOn?'ON':'OFF');$('sfxBtn').textContent='🔊 '+s('sfxL')+': '+(sfxOn?'ON':'OFF');}
function aiCounter(card){const d=cfg.diff;if(d==='nabbo')return Math.random()<.2;if(d==='pro'){const f=P[0].field,cn={};f.forEach(c=>cn[c]=(cn[c]||0)+1);const th=Math.max(0,...Object.values(cn))>=3||Object.keys(cn).length>=3;return th||card==='R'||card==='B'||Math.random()<.7;}return card==='R'||card==='B'||Math.random()<.5;}
const SYM={R:'🔥',B:'💀',G:'🌲',U:'💧',W:'☀️'};
function card(c,sz,attr,an){const x=sz===true?'sm':sz;return '<div '+(attr||'')+' class="mcard '+(x?x+' ':'')+(an?an+' ':'')+'l-'+c+'"><div class="ct">'+nm(c)+'</div><div class="art"><div class="mana"></div></div><div class="cty">'+s('type')+'</div><div class="cx">'+(x==='lg'?S[lang].e[c]:S[lang].es[c])+'</div></div>';}
const gn=i=>i?s('pc'):s('you');
function aiLater(fn,ms,force){const g=gid;setTimeout(()=>{if(g===gid&&(force||!over))fn();},ms);}
function pickDup(pl,o){const f=P[pl].field,h=P[pl].hand;const x=o.find(k=>f.includes(h[k.val]));return (x||o[Math.floor(Math.random()*o.length)]).val;}
const s=k=>S[lang][k], nm=c=>S[lang].n[c];

function log(t){const el=$('log');el.innerHTML='> '+t+'<br>'+el.innerHTML;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function choose(title,opts,cb,who,best,cardc){if(who===1){const v=best&&cfg.diff!=='nabbo'?best(opts):opts[Math.floor(Math.random()*opts.length)].val;return aiLater(()=>cb(v),700,true);}const m=$('choiceModal');$('choiceTitle').textContent=title;$('choiceCard').innerHTML=cardc?card(cardc,'sm'):'';const box=$('choiceOpts');box.innerHTML='';
 opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='w-full bg-zinc-800 border border-white/20 rounded-xl p-3 mb-2 text-left';b.textContent=o.label;b.onclick=()=>{m.style.display='none';cb(o.val);};box.appendChild(b);});m.style.display='flex';}

function initDeck(){gid++;
 const per=cfg.size/5;deck=[];['R','B','G','U','W'].forEach(c=>{for(let i=0;i<per;i++)deck.push(c);});shuffle(deck);
 P=[{hand:[],field:[],grave:[]},{hand:[],field:[],grave:[]}];
 for(let p=0;p<2;p++)for(let i=0;i<cfg.hand;i++)P[p].hand.push(deck.pop());
 turn=0;dropped=false;over=false;$('log').innerHTML='';log(s('newgame')+' ('+cfg.size+' / '+cfg.hand+')');render();showRules();}
function draw(p){if(!deck.length){log(s('deckEmpty'));return;}P[p].hand.push(deck.pop());FX.drawn=[p,P[p].hand.length-1];sfx('draw');}

function playCard(idx,isAI){
 if(over||PICK||$('choiceModal').style.display==='flex'||$('rulesModal').style.display==='flex')return;
 if(!isAI&&turn!==0)return;
 if(dropped){log(s('already'));return;}
 const me=P[turn],oi=1-turn,opp=P[oi],card=me.hand.splice(idx,1)[0];
 dropped=true;log(gn(turn)+' '+s('plays')+' '+nm(card));
 const done=()=>{FX.cast=null;checkWin();render();if(!over)aiLater(()=>endTurn(true),turn===1?900:1100);};
 const enter=()=>{FX.cast=null;me.field.push(card);sfx('play');FX.add=[turn,me.field.length-1];render();etb(card,me,opp,done);};
 // Isola dell'avversario: la terra viene contrastata, NON entra in campo e va al cimitero
 if(opp.hand.includes('U')&&opp.hand.length>=2){
  FX.cast=[turn,card];
  const fin=()=>{me.grave.push(card);const t=gn(oi)+' '+s('countered')+'\n'+nm(card)+' → '+s('grave');log(t.replace('\n',' '));sfx('counter');toast('💧 '+t);done();};
  const useIsland=i=>{opp.grave.push(opp.hand.splice(i,1)[0]);pickOn(s('disc2'),'hand',0,opp.hand.map((c,k)=>k),j=>{opp.grave.push(opp.hand.splice(j,1)[0]);fin();});};
  // il PC gira le carte che scarta, così si vede che gioca un'Isola
  const aiSeq=()=>{const ii=opp.hand.indexOf('U'),rest=opp.hand.map((c,k)=>k).filter(k=>k!==ii),di=cfg.diff==='nabbo'?rest[Math.floor(Math.random()*rest.length)]:pickDup(oi,rest.map(k=>({val:k})));
   FX.reveal=[oi,[ii,di]];sfx('chime');render();
   aiLater(()=>{FX.reveal=null;const a=Math.max(ii,di),b=Math.min(ii,di);opp.grave.push(opp.hand.splice(a,1)[0],opp.hand.splice(b,1)[0]);fin();},1400,true);};
  const q=gn(turn)+' '+s('plays')+' '+nm(card)+' — '+s('counter');
  if(oi===0){PICK={ask:true,title:q,zone:'hand',pl:0,idxs:opp.hand.map((c,k)=>c==='U'?k:-1).filter(k=>k>=0),cb:useIsland,no:enter};render();}
  else{render();choose(q,[{label:s('yes'),val:1},{label:s('no'),val:0}],v=>v?aiSeq():enter(),oi,()=>aiCounter(card)?1:0);}
 }else enter();
}

function etb(card,me,opp,done){
 if(card==='W'){draw(turn);log(gn(turn)+' '+s('draws'));return done();}
 if(card==='U'){if(!deck.length)return done();sfx('chime');const top=deck[deck.length-1];
  return choose(s('scry')+' '+nm(top),[{label:s('top'),val:0},{label:s('bottom'),val:1}],v=>{if(v)deck.unshift(deck.pop());done();},turn,()=>P[turn].field.includes(top)?1:0);}
 if(card==='R'){if(!opp.field.length){log(s('noTarget'));return done();}
  const kill=i=>{const c=opp.field.splice(i,1)[0];opp.grave.push(c);log(nm(c)+' '+s('destroyed'));sfx('destroy');toast('🔥 '+nm(c)+' '+s('destroyed'));FX.ghost=[P.indexOf(opp),i,c];setTimeout(()=>{FX.ghost=null;render();},700);done();};
  if(turn===0)return pickOn(s('pickLand'),'field',1,opp.field.map((c,i)=>i),kill);
  return choose(s('pickLand'),opp.field.map((c,i)=>({label:nm(c),val:i})),kill,turn,o=>{const f=opp.field,n=k=>f.filter(x=>x===f[k.val]).length;let b=o[0];o.forEach(k=>{if(n(k)>n(b))b=k;});return b.val;});}
 if(card==='B'){if(!opp.hand.length){log(s('noCards'));return done();}
  const idxs=shuffle(opp.hand.map((c,i)=>i)).slice(0,3);
  return choose(s('swamp'),idxs.map(i=>({label:nm(opp.hand[i]),val:i})),i=>{const c=opp.hand.splice(i,1)[0];opp.grave.push(c);log(gn(P.indexOf(opp))+' '+s('discarded')+' '+nm(c));sfx('discard');done();},turn,o=>{const x=o.find(k=>!opp.field.includes(opp.hand[k.val]));return (x||o[0]).val;});}
 if(card==='G'){const types=[...new Set(me.grave)];if(!types.length){log(s('noCards'));return done();}
  return choose(s('forest'),types.map(c=>({label:nm(c),val:c})),c=>{me.grave.splice(me.grave.lastIndexOf(c),1);me.hand.push(c);log(gn(turn)+' '+s('back')+' '+nm(c));sfx('recover');done();},turn,o=>{const x=o.find(k=>!me.field.includes(k.val));return (x||o[0]).val;});}
 done();}

function checkWin(){
 const f=P[turn].field,cnt={};f.forEach(c=>cnt[c]=(cnt[c]||0)+1);
 let msg=null;
 if(Object.keys(cnt).length>=5)msg=s('winD');
 else for(const k in cnt)if(cnt[k]>=5)msg=s('winS')+' '+nm(k);
 if(msg){over=true;sfx(turn===0?'win':'lose');choose(gn(turn)+' '+msg,[{label:s('again'),val:1}],initDeck);}}

function endTurn(fromAI){
 if(over||PICK||$('choiceModal').style.display==='flex')return;
 if(fromAI!==true&&turn!==0)return;
 if(!deck.length&&!P[0].hand.length&&!P[1].hand.length){over=true;sfx('lose');choose(s('tie'),[{label:s('again'),val:1}],initDeck);return;}
 turn=1-turn;dropped=false;log('--- '+gn(turn)+' ---');sfx('pass');draw(turn);render();if(turn===1)aiLater(aiTurn,900);else if(!P[0].hand.length){log(s('noPlay'));toast(s('noPlay'));aiLater(()=>endTurn(true),1500);}}
function aiTurn(){
 if(over||turn!==1)return;const h=P[1].hand,f=P[1].field;
 if(!h.length)return aiLater(()=>endTurn(true),700);
 const d=cfg.diff;if(d==='nabbo'){playCard(Math.floor(Math.random()*h.length),true);return;}
 let best=-1,bi=0;
 h.forEach((c,i)=>{let sc=(d==='pro'?Math.random()*.3:Math.random())+f.filter(x=>x===c).length*.8;if(!f.includes(c))sc+=2;if(c==='R'&&P[0].field.length)sc+=1;if(c==='B'&&P[0].hand.length)sc+=.5;if(d==='pro'&&c==='R'&&new Set(P[0].field).size>=3)sc+=3;if(c==='G'&&P[1].grave.length)sc+=.5;if(c==='W'&&deck.length)sc+=.3;if(sc>best){best=sc;bi=i;}});
 playCard(bi,true);}

const FX={add:null,ghost:null,drawn:null,cast:null,reveal:null};let PICK=null,rulesHidden=false;
function pickOn(title,zone,pl,idxs,cb){if(!idxs.length)return cb(-1);PICK={title,zone,pl,idxs,cb};render();}
function askYes(){if(PICK&&PICK.ask)pickDone('hand',0,PICK.idxs[0]);}
function askNo(){if(!PICK||!PICK.ask)return;const f=PICK.no;PICK=null;render();f();}
function pickDone(zone,pl,i){if(!PICK||PICK.zone!==zone||PICK.pl!==pl||!PICK.idxs.includes(i))return;const cb=PICK.cb;PICK=null;render();cb(i);}
function showGrave(pl){const g=P[pl].grave;$('graveTitle').textContent=s('grave')+' · '+gn(pl)+' ('+g.length+')';$('graveCards').innerHTML=g.length?g.map(c=>card(c,true,'onclick="zoom(\''+c+'\')"')).join(''):'<span class="opacity-60 text-sm">'+s('noCards')+'</span>';$('graveClose').textContent=s('close');$('graveModal').style.display='flex';}
function showRules(force){const f=force===true;if(rulesHidden&&!f)return;$('rulesT').textContent=s('rulesT');$('rulesBody').innerHTML=s('rules').map(t=>'<div>'+t+'</div>').join('');$('rulesHideL').textContent=s('hideMsg');$('rulesGo').textContent=f?s('close'):s('go');$('rulesHideWrap').style.display=f?'none':'flex';$('rulesHide').checked=false;$('rulesModal').style.display='flex';}
let lpT=null,lpF=false;
function lpStart(c){lpF=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpF=true;zoom(c);},450);}
function lpEnd(){clearTimeout(lpT);}
function zoom(c){$('zoomCard').innerHTML=card(c,'lg');$('zoomModal').style.display='flex';}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='none';void e.offsetWidth;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{e.style.display='none';},1700);}
function pile(pl){const g=P[pl].grave,top=g[g.length-1];return '<div class="pile" onclick="showGrave('+pl+')" title="'+s('grave')+'">'+(top?card(top,'xs'):'<div class="pempty">🪦</div>')+'<span class="pcount">'+g.length+'</span></div>';}
function deckPile(){return '<div class="dpile'+(FX.drawn?' deckpulse':'')+'"><div class="dback"></div><span class="pcount">'+deck.length+'</span></div>';}
function fieldHtml(pi){const f=P[pi].field,g=FX.ghost&&FX.ghost[0]===pi,n=f.length+(g?1:0)+(FX.cast&&FX.cast[0]===pi?1:0),w=window.innerWidth>=640,z=n>(w?14:10)?'xxs':n>(w?8:3)?'xs':'sm';
 const pk=PICK&&PICK.zone==='field'&&PICK.pl===pi;
 const a=f.map((c,i)=>{const ok=pk&&PICK.idxs.includes(i);return card(c,z,ok?'onclick="pickDone(\'field\','+pi+','+i+')"':'onclick="zoom(\''+c+'\')"',(FX.add&&FX.add[0]===pi&&FX.add[1]===i?(pi?'enter2':'enter'):'')+(ok?' pickable':''));});
 if(g)a.splice(FX.ghost[1],0,card(FX.ghost[2],z,'','dying'));if(FX.cast&&FX.cast[0]===pi)a.push(card(FX.cast[1],z,'','casting'));return a.join('');}
function zone(pi){const p=P[pi],me=pi===turn;
 const ask=(pi===0&&PICK&&PICK.ask)?'<div class="askbar"><div class="asktxt">'+PICK.title+'</div><div class="askbtns"><button type="button" onclick="askYes()" class="gold font-black px-5 py-1 rounded-lg">'+s('yes').toUpperCase()+'</button><button type="button" onclick="askNo()" class="askno font-black px-5 py-1 rounded-lg">NO</button></div></div>':'';
 let h='<div class="panel'+(me?' active':'')+(pi?' pc':'')+'"><div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-1"><span class="pname'+(me?' on':'')+'">'+(pi?s('pc'):s('you'))+'</span></div>'+ask;
 h+='<div class="'+(pi?'':'hand ')+'flex flex-wrap justify-center gap-1.5 sm:gap-2 mt-1 '+(pi?'':'min-h-[5.8rem] sm:min-h-[9.5rem] ')+'items-end">';
 const hp=PICK&&PICK.zone==='hand'&&PICK.pl===0;
 h+=pi===0?p.hand.map((c,i)=>{const ok=hp&&PICK.idxs.includes(i);return card(c,false,hp?(ok?'onclick="pickDone(\'hand\',0,'+i+')"':''):'onpointerdown="lpStart(\''+c+'\')" onpointerup="lpEnd()" onpointerleave="lpEnd()" oncontextmenu="return false" onclick="if(lpF){lpF=false;return}playCard('+i+')"',(FX.drawn&&FX.drawn[0]===0&&FX.drawn[1]===i?'drawn ':'')+(ok?'pickable':hp?'dim':''));}).join(''):p.hand.map((c,i)=>FX.reveal&&FX.reveal[0]===1&&FX.reveal[1].includes(i)?card(c,'xs','','rvflip'):'<div class="cback opp'+(FX.drawn&&FX.drawn[0]===1&&FX.drawn[1]===i?' drawn2':'')+'"></div>').join('');
 return h+'</div></div>';}
function render(){
 $('sub').textContent=s('sub');$('lblDiff').textContent=s('diff');$('rulesBtn').textContent='📜 '+s('rulesB');audioBtns();
 $('field0').classList.toggle('sideon',turn===0);$('mat').classList.toggle('turn0',turn===0);$('mat').classList.toggle('turn1',turn===1);
 $('turnBar').innerHTML=over?'':'<div class="turnline t'+turn+'"><span class="tl-line"></span><span class="tl-pill">'+(turn?'⏳ '+s('pcTurn'):'▶ '+s('yourTurn')+' ◀')+'</span><span class="tl-line"></span></div>';$('field1').classList.toggle('sideon',turn===1);
 $('zone1').innerHTML=zone(1);$('zone0').innerHTML=zone(0);
 $('field1').innerHTML=fieldHtml(1);$('field0').innerHTML=fieldHtml(0);
 $('pile1').innerHTML=pile(1);$('pile0').innerHTML=pile(0);$('deckPile').innerHTML=deckPile();
 const pb=$('pickBar');pb.style.display=PICK&&!PICK.ask?'block':'none';if(PICK)pb.textContent=PICK.title;
 FX.add=null;FX.drawn=null;}

function setBg(n){$('body').style.background=BG[n]||BG.default;$('body').style.backgroundSize='cover';$('body').style.backgroundAttachment='fixed';store.set('blg_bg',n);}
$('bgGrid').innerHTML=Object.keys(BG).map(k=>'<button type="button" data-bg="'+k+'" class="bgBtn rounded-xl h-16 border-2 border-white/20 text-xs font-bold" style="background:'+BG[k]+';color:'+(k==='plains'?'#000':'#fff')+'">'+k.toUpperCase()+'</button>').join('');
document.querySelectorAll('.bgBtn').forEach(b=>b.addEventListener('click',()=>setBg(b.dataset.bg)));
$('settingsBtn').addEventListener('click',()=>$('settingsModal').style.display='flex');
const closeS=()=>$('settingsModal').style.display='none';
$('closeSettingsBtn').addEventListener('click',closeS);
$('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeS();});

$('langSelect').addEventListener('change',e=>{lang=e.target.value;store.set('blg_lang',lang);render();});
$('handSelect').addEventListener('change',e=>{cfg.hand=+e.target.value;store.set('blg_hand',cfg.hand);initDeck();});
$('graveClose').addEventListener('click',()=>$('graveModal').style.display='none');
$('graveModal').addEventListener('click',e=>{if(e.target.id==='graveModal')e.target.style.display='none';});
$('rulesBtn').addEventListener('click',()=>showRules(true));
$('zoomModal').addEventListener('click',()=>{$('zoomModal').style.display='none';});
$('rulesGo').addEventListener('click',()=>{if($('rulesHide').checked)rulesHidden=true;$('rulesModal').style.display='none';});
window.addEventListener('resize',()=>render());
$('musicBtn').addEventListener('click',()=>{musicOn=!musicOn;store.set('blg_music',musicOn?'1':'0');setMusic();audioBtns();});
$('sfxBtn').addEventListener('click',()=>{sfxOn=!sfxOn;store.set('blg_sfx',sfxOn?'1':'0');audioBtns();if(sfxOn)sfx('chime');});
$('diffSelect').addEventListener('change',e=>{cfg.diff=e.target.value;store.set('blg_diff',cfg.diff);});
document.addEventListener('pointerdown',()=>{if(musicOn)setMusic();},{once:true});
$('blgLogo').src=BLG;$('ldA').src=LD;$('ldB').src=LD;$('diffSelect').value=cfg.diff;$('langSelect').value=lang;$('handSelect').value=cfg.hand;
setBg(store.get('blg_bg','default'));initDeck();
</script></body></html>
